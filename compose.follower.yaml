# A rig over two machines on one computer (goal 205), for the follower acceptance check
# (scripts/acceptance/follower.mjs): the rig local-1's harness leads, and follower-1, a harness
# started as a follower and its supervisor, with volumes and networks of their own, is where the
# judge builds and measures and where the lane's trials run. Its supervisor registers its own key
# on the message bus with control and answers the leader's asks there.
#
#   podman compose -f compose.yaml -f compose.follower.yaml up -d
x-logging: &logging
  driver: json-file
  options: { max-size: "50m", max-file: "3" }

services:
  harness:
    environment:
      # The leader neither judges nor works: the follower's CPU is the judge's and the workers'.
      THERMITE_FOLLOWERS: follower-1=1+1
      THERMITE_LOCAL_JUDGE: "0"
      THERMITE_LOCAL_LANES: "0"

  harness-f:
    build: { context: ., dockerfile: containers/Containerfile, target: harness, args: { THERMITE_COMMIT: "${THERMITE_COMMIT:-}" } }
    environment:
      THERMITE_RIG_ID: local-1
      THERMITE_ROLE: follower
      THERMITE_TARGET: cpu
      THERMITE_CONTROL_PUBKEY_FILE: /keys/control-signing.pub
      THERMITE_SUPERVISOR_TOKEN_FILE: /run/secrets/harness-supervisor-token
    volumes:
      - harness-f-state:/var/lib/thermite
      - harness-f-scratch:/scratch
      - ./.dev/inbox-f:/controller/inbox:ro
      - outbox-f:/outbox
      - control-pub:/keys:ro
    secrets: [harness-supervisor-token]
    networks: [rig-f, rig-f-egress]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

  supervisor-f:
    build: { context: ., dockerfile: containers/Containerfile, target: supervisor, args: { THERMITE_COMMIT: "${THERMITE_COMMIT:-}" } }
    environment:
      THERMITE_RIG_ID: local-1
      THERMITE_ROLE: follower
      THERMITE_MACHINE: follower-1
      HARNESS_URL: http://harness-f:8700
      CONTROL_URL: http://control:8800
      THERMITE_HARNESS_TOKEN_FILE: /run/secrets/harness-supervisor-token
      THERMITE_CONTROL_TOKEN_FILE: /run/secrets/control-rig-token
      THERMITE_NATS_URL: nats://nats:4222
      THERMITE_NATS_CA_FILE: /keys/bus-ca.pem
    volumes:
      - supervisor-f-home:/var/lib/thermite-supervisor
      - ./.dev/inbox-f:/supervisor/inbox
      - outbox-f:/outbox:ro
      - control-pub:/keys:ro
    secrets: [harness-supervisor-token, control-rig-token]
    networks: [rig-f, control, rig-f-egress]
    depends_on:
      harness-f: { condition: service_started }
      control: { condition: service_started }
      enroll: { condition: service_completed_successfully }
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, KILL, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *logging

networks:
  rig-f: { internal: true }
  rig-f-egress: {}

volumes:
  harness-f-state: {}
  harness-f-scratch: {}
  outbox-f: {}
  supervisor-f-home: {}
