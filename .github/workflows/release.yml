# Releases. On a tag v*, it builds the control, harness (CPU and CUDA) and supervisor images from
# their Containerfiles, and the one-container rig image for RunPod on the CUDA harness, and pushes
# them to GitHub's container registry, tagged with the version and the commit. Then it writes the
# release bundle, a compose file that pins those images by digest and a short readme
# (scripts/release-bundle.ts), and attaches both to a draft GitHub Release.
#
# Run by hand (Actions › release › Run workflow), or on a push to the development branch that
# changes the images or this release path, it builds the same images and the same bundle, but
# pushes nothing out and makes no release: the bundle is kept as the run's artifact. (A run by hand
# needs this file on the default branch; the push to the development branch does not.)
#
# The images never carry Claude Code: no build here sets CLAUDE_CODE_VERSION. The harness images
# carry OpenCode and the Codex CLI, both open source, at their Containerfile's pinned versions.
name: release

on:
  push:
    tags: ["v*"]
    # A dry run. Paths are not checked for tags, so every v* tag still releases.
    branches: [v1/build]
    paths:
      - .github/workflows/release.yml
      - containers/**
      - scripts/release-bundle.ts
      - src/release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Only a pushed tag publishes. A run by hand builds and checks without pushing anything out.
  PUSH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  # The CUDA harness's base: CUDA 12 (CUDA 13 dropped older GPU architectures), a development
  # image (the GPU smoke kit compiles with nvcc) on Ubuntu, pinned by its digest.
  CUDA_BASE_IMAGE: docker.io/nvidia/cuda:12.6.3-devel-ubuntu22.04@sha256:d49bb8a4ff97fb5fe477947a3f02aa8c0a53eae77e11f00ec28618a0bcaa2ad1
  # A dry run's CUDA harness goes to the CUDA job's own registry (the service below), which ends
  # with the job, so the rig image is built on it by digest as in a release.
  DRY_RUN_REGISTRY: localhost:5000
  RIG_DESCRIPTION: "Thermite's one-container rig for RunPod pods (CUDA 12.6): a rig's harness and supervisor in one container."

jobs:
  version:
    name: version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      registry: ${{ steps.version.outputs.registry }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read the version, and check the tag against package.json
        run: |
          pkg=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            case "$version" in
              "$pkg" | "$pkg"-*) ;;
              *)
                echo "::error::The tag $GITHUB_REF_NAME does not match package.json's version $pkg."
                exit 1
                ;;
            esac
          else
            version="$pkg"
          fi
          # Image names are lowercase; an owner's name may not be.
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          echo "commit=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "Version $version, images under ghcr.io/$owner, push: $PUSH"

  images:
    name: image ${{ matrix.key }}
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    # A registry on the runner, for the CUDA harness's dry run only: an empty image starts no
    # service. (The expression is PUSH's, negated: a service can't read env.)
    services:
      registry:
        image: ${{ matrix.cuda && !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && 'docker.io/library/registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e' || '' }}
        ports: ["5000:5000"]
    strategy:
      fail-fast: true
      matrix:
        include:
          - key: control
            repository: thermite-control
            containerfile: containers/control/Containerfile
            platforms: linux/amd64,linux/arm64
            suffix: ""
            cuda: false
            description: "Thermite's control service: the dashboard, the REST API and MCP."
          - key: harness
            repository: thermite-harness
            containerfile: containers/harness/Containerfile
            platforms: linux/amd64,linux/arm64
            suffix: ""
            cuda: false
            description: "Thermite's harness for CPU rigs: the judge, the broker and the agents."
          # The CUDA harness: the same Containerfile on a CUDA base, in the same package as the
          # CPU harness, with tags that end in -cuda. The same job then builds the rig image on it.
          - key: harness-cuda
            repository: thermite-harness
            containerfile: containers/harness/Containerfile
            platforms: linux/amd64
            suffix: "-cuda"
            cuda: true
            description: "Thermite's harness for GPU rigs (CUDA 12.6): the judge, the broker and the agents."
          - key: supervisor
            repository: thermite-supervisor
            containerfile: containers/supervisor/Containerfile
            platforms: linux/amd64,linux/arm64
            suffix: ""
            cuda: false
            description: "Thermite's supervisor: a rig's link to control, and its git work."
    steps:
      - uses: actions/checkout@v4
      # The CUDA base is several gigabytes: make room on the runner's disk first.
      - name: Make room for the CUDA image
        if: matrix.cuda
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # arm64 images are built under emulation.
      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@v3
        with:
          # On the host's network, the CUDA job's builder reaches the job's own registry.
          driver-opts: ${{ matrix.cuda && 'network=host' || '' }}
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: the version (0.1.0) and the commit's first 12 characters, each with the CUDA suffix
      # for the CUDA harness. Labels and annotations: the source repository, which links each
      # package to this repository, and the version and commit.
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "12"
          # A multi-platform image is an index, and the registry reads the index's annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: ${{ matrix.cuda && 'manifest' || 'manifest,index' }}
        with:
          images: ${{ needs.version.outputs.registry }}/${{ matrix.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=${{ matrix.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.containerfile }}
          platforms: ${{ matrix.platforms }}
          # Every image reports THERMITE_COMMIT with the version in package.json, and control
          # compares rigs' builds with its own. THERMITE_IMAGE_ID is the image's tag and commit:
          # the harness reports it, and puts it in each build's key. Control's and the
          # supervisor's files do not use it.
          build-args: |
            THERMITE_COMMIT=${{ github.sha }}
            THERMITE_IMAGE_ID=${{ needs.version.outputs.version }}${{ matrix.suffix }}+${{ needs.version.outputs.commit }}
            ${{ matrix.cuda && format('BASE_IMAGE={0}', env.CUDA_BASE_IMAGE) || '' }}
          # A tag pushes every image to GHCR. A dry run pushes none out: each stays in the builder,
          # but for the CUDA harness, which goes to the job's own registry under a name of that
          # registry alone, for the rig image below.
          tags: ${{ (matrix.cuda && env.PUSH != 'true') && format('{0}/{1}:dry-run-cuda', env.DRY_RUN_REGISTRY, matrix.repository) || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # An image either way, so the build reports its digest.
          outputs: type=image,push=${{ env.PUSH == 'true' || matrix.cuda }}
          cache-from: type=gha,scope=${{ matrix.key }}
          # The CUDA layers would crowd everything else out of the cache.
          cache-to: ${{ !matrix.cuda && format('type=gha,mode=max,scope={0}', matrix.key) || '' }}
      - name: Keep the image's digest for the bundle
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::The build reported no image digest."; exit 1 ;;
          esac
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${{ matrix.key }}"
          echo "${{ matrix.key }}: $DIGEST"
      # The one-container rig image, which RunPod pods run (containers/rig/Containerfile): the CUDA
      # harness just built, named by its digest (on GHCR for a tag, in the job's own registry for
      # a dry run), with the supervisor's parts added. It keeps the harness's THERMITE_COMMIT and
      # THERMITE_IMAGE_ID. Tags, labels and annotations as for the other images, under thermite-rig.
      - id: rig-meta
        if: matrix.cuda
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "12"
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ needs.version.outputs.registry }}/thermite-rig
          flavor: |
            latest=false
            suffix=-cuda
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=thermite-rig
            org.opencontainers.image.description=${{ env.RIG_DESCRIPTION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=thermite-rig
            org.opencontainers.image.description=${{ env.RIG_DESCRIPTION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - id: rig-build
        if: matrix.cuda
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/rig/Containerfile
          platforms: linux/amd64
          build-args: |
            HARNESS_IMAGE=${{ env.PUSH == 'true' && needs.version.outputs.registry || env.DRY_RUN_REGISTRY }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          tags: ${{ steps.rig-meta.outputs.tags }}
          labels: ${{ steps.rig-meta.outputs.labels }}
          annotations: ${{ steps.rig-meta.outputs.annotations }}
          # An image either way, so the build reports its digest; pushed only for a tag.
          outputs: type=image,push=${{ env.PUSH }}
      - name: Keep the rig image's digest for the bundle
        if: matrix.cuda
        env:
          DIGEST: ${{ steps.rig-build.outputs.digest }}
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::The rig image's build reported no image digest."; exit 1 ;;
          esac
          printf '%s\n' "$DIGEST" > digests/rig-cuda
          echo "rig-cuda: $DIGEST"
      # One file per image: the CUDA job's holds the rig image's too.
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.key }}
          path: digests/
          if-no-files-found: error
          retention-days: 7

  bundle:
    name: release bundle
    needs: [version, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      # The script needs no packages: only Node.js and the files in the repository.
      - name: Write the bundle from the images' digests
        run: |
          node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/release-bundle.ts \
            --version '${{ needs.version.outputs.version }}' \
            --registry '${{ needs.version.outputs.registry }}' \
            --repo-url '${{ github.server_url }}/${{ github.repository }}' \
            --digests digests --out bundle
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: bundle/
          if-no-files-found: error
      # A draft: a maintainer reads it, then publishes it. A run again for the same tag replaces
      # the files of the release it made before.
      - name: Attach the bundle to a draft release
        if: env.PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bundle/compose.yaml bundle/README.md --clobber
          else
            gh release create "$TAG" --draft --verify-tag --title "Thermite $TAG" \
              --notes-file bundle/README.md bundle/compose.yaml bundle/README.md
          fi
