# Releases. On a tag v*, it builds the control, harness (CPU and CUDA) and supervisor images from
# their Containerfiles, and the one-container rig image for RunPod on the CUDA harness, and pushes
# them to GitHub's container registry, tagged with the commit. Then it checks each published image
# (scripts/release/check-images.ts): pulled by digest with no sign-in, it reports the commit, carries no
# Claude Code, no key and, for the rig image, no set-id file (goal 010). Only images that hold get
# the version's tag. Then it writes the release bundle, a compose file that pins those images by
# digest and a short readme that gives the compose file's SHA-256 (scripts/release/bundle.ts), and
# attaches both to a draft GitHub Release, whose notes are the readme.
#
# Run by hand (Actions › release › Run workflow) with "publish" ticked, it pushes and checks the
# same images for the commit it runs on, tagged with the commit only: no version tag and no
# release, so a lab can pin a build between releases by its digest (the check's step summary lists
# them). Run by hand without it, or on a push to main or to a version's branch that changes the
# images or this release path, it builds the same images and the same bundle, but pushes nothing
# out and makes no release: the bundle is kept as the run's artifact. (A run by hand needs this
# file on the default branch; a push does not.)
#
# No run uses runners until a maintainer approves it, as in ci.yml: the first job, approval,
# deploys to the repository's environment ci, and every other job waits for it.
#
# Each action is pinned by its commit, with its version in a comment, and a value from the tag or
# the run reaches a script as an environment variable, never as its text (as in ci.yml).
#
# The images never carry Claude Code: no build here sets CLAUDE_CODE_VERSION. The harness images
# carry OpenCode and the Codex CLI, both open source, at their Containerfile's pinned versions.
name: release

on:
  push:
    tags: ["v*"]
    # A dry run. Paths are not checked for tags, so every v* tag still releases.
    branches: [main, "v[0-9]*"]
    paths:
      - .github/workflows/release.yml
      - containers/**
      - scripts/release/bundle.ts
      - src/release/**
      - tests/release/**
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the images to GHCR, tagged with the commit only (no version tag, no release), and check them"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # A pushed tag publishes and releases; a run by hand with "publish" publishes only. Any other run
  # builds and checks without pushing anything out.
  PUBLISH: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
  RELEASE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  # The CUDA harnesses' bases (goal 132), development images (the GPU smoke kit compiles with
  # nvcc) on Ubuntu, pinned by their digests. CUDA 12 for Pascal to Hopper, P100 and V100 included,
  # on amd64; CUDA 13 dropped Maxwell, Pascal and Volta and knows Blackwell, on amd64 and arm64
  # (the DGX Spark). 13.0 is the CUDA of the 580 drivers, so the image needs no newer driver.
  CUDA_BASE_IMAGE: docker.io/nvidia/cuda:12.6.3-devel-ubuntu22.04@sha256:d49bb8a4ff97fb5fe477947a3f02aa8c0a53eae77e11f00ec28618a0bcaa2ad1
  CUDA13_BASE_IMAGE: docker.io/nvidia/cuda:13.0.3-devel-ubuntu24.04@sha256:b7ae301dea2c162444795462ce17a05f6a516e5a75944b57af5b88540a1a2266
  # A dry run's CUDA harness goes to the CUDA job's own registry (the service below), which ends
  # with the job, so the rig image is built on it by digest as in a release.
  DRY_RUN_REGISTRY: localhost:5000
  RIG_DESCRIPTION: "Thermite's one-container rig for RunPod pods (CUDA 12.6): a rig's harness and supervisor in one container."

jobs:
  # Waits for a reviewer of the environment ci to approve the run; one approval starts every job.
  approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ci
    steps:
      - run: echo "Approved; the run's jobs start."

  version:
    name: version
    needs: approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      registry: ${{ steps.version.outputs.registry }}
      commit: ${{ steps.version.outputs.commit }}
      # For the jobs' conditions, which can't read the workflow's env.
      publish: ${{ env.PUBLISH }}
      release: ${{ env.RELEASE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        name: Read the version, and check the tag against package.json
        run: |
          pkg=$(node -p 'require("./package.json").version')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            case "$version" in
              *[!0-9A-Za-z.-]*)
                echo "::error::A version tag holds only letters, digits, dots and hyphens."
                exit 1
                ;;
              "$pkg" | "$pkg"-*) ;;
              *)
                echo "::error::The tag $GITHUB_REF_NAME does not match package.json's version $pkg."
                exit 1
                ;;
            esac
          else
            version="$pkg"
          fi
          # Image names are lowercase; an owner's name may not be.
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          echo "commit=$(printf '%s' "$GITHUB_SHA" | cut -c1-12)" >> "$GITHUB_OUTPUT"
          echo "Version $version, images under ghcr.io/$owner, publish: $PUBLISH, release: $RELEASE"

  images:
    name: image ${{ matrix.key }}
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    # A registry on the runner, for the CUDA harness's dry run only: an empty image starts no
    # service. (A service can't read env: the version job's output says whether the run publishes.)
    services:
      registry:
        image: ${{ matrix.cuda && needs.version.outputs.publish != 'true' && 'docker.io/library/registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e' || '' }}
        ports: ["5000:5000"]
    strategy:
      fail-fast: true
      matrix:
        include:
          - key: control
            repository: thermite-control
            containerfile: containers/control/Containerfile
            platforms: linux/amd64,linux/arm64
            suffix: ""
            cuda: false
            description: "Thermite's control service: the dashboard, the REST API and MCP."
            licenses: MIT
          # The harness images carry the Codex CLI (Apache-2.0, with its NOTICE) and OpenCode (MIT)
          # beside Thermite (MIT): their licence label is the SPDX expression of all three.
          - key: harness
            repository: thermite-harness
            containerfile: containers/harness/Containerfile
            platforms: linux/amd64,linux/arm64
            suffix: ""
            cuda: false
            description: "Thermite's harness for CPU rigs: the judge, the broker and the agents."
            licenses: "MIT AND Apache-2.0"
          # The CUDA harnesses: the same Containerfile on a CUDA base (cuda_base names it), in the
          # same package as the CPU harness. CUDA 12 under tags that end in -cuda, for Pascal to
          # Hopper; the same job then builds the rig image on it (rig). CUDA 13 under tags that
          # end in -cuda13, for Turing to Blackwell, on arm64 too (goal 132).
          - key: harness-cuda
            repository: thermite-harness
            containerfile: containers/harness/Containerfile
            platforms: linux/amd64
            suffix: "-cuda"
            cuda: true
            cuda_base: CUDA_BASE_IMAGE
            rig: true
            description: "Thermite's harness for GPU rigs (CUDA 12.6: Pascal to Hopper): the judge, the broker and the agents."
            licenses: "MIT AND Apache-2.0"
          - key: harness-cuda13
            repository: thermite-harness
            containerfile: containers/harness/Containerfile
            platforms: linux/amd64,linux/arm64
            suffix: "-cuda13"
            cuda: true
            cuda_base: CUDA13_BASE_IMAGE
            rig: false
            description: "Thermite's harness for GPU rigs (CUDA 13.0: Turing to Blackwell, DGX Spark): the judge, the broker and the agents."
            licenses: "MIT AND Apache-2.0"
          # The supervisor carries OpenCode (MIT) and the Codex CLI (Apache-2.0, with its NOTICE)
          # for the advisors, as the harness images do.
          - key: supervisor
            repository: thermite-supervisor
            containerfile: containers/supervisor/Containerfile
            platforms: linux/amd64,linux/arm64
            suffix: ""
            cuda: false
            description: "Thermite's supervisor: a rig's link to control, its advisors and its git work."
            licenses: "MIT AND Apache-2.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The CUDA base is several gigabytes: make room on the runner's disk first.
      - name: Make room for the CUDA image
        if: matrix.cuda
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      # arm64 images are built under emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: contains(matrix.platforms, 'arm64')
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # On the host's network, the CUDA job's builder reaches the job's own registry.
          driver-opts: ${{ matrix.cuda && 'network=host' || '' }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: the commit's first 12 characters, with the CUDA suffix for the CUDA harness. The
      # version's tag (0.1.0) comes later, once the image passed its checks (the tag job). Labels
      # and annotations: the source repository, which links each package to this repository, and
      # the version and commit.
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "12"
          # A multi-platform image is an index, and the registry reads the index's annotations.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: ${{ contains(matrix.platforms, ',') && 'manifest,index' || 'manifest' }}
        with:
          images: ${{ needs.version.outputs.registry }}/${{ matrix.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }}
          tags: |
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
          annotations: |
            org.opencontainers.image.title=${{ matrix.repository }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.containerfile }}
          platforms: ${{ matrix.platforms }}
          # Every image reports THERMITE_COMMIT with the version in package.json, and control
          # compares rigs' builds with its own. THERMITE_IMAGE_ID is the image's tag and commit:
          # the harness reports it as its image. Control's and the supervisor's files do not use
          # it.
          build-args: |
            THERMITE_COMMIT=${{ github.sha }}
            THERMITE_IMAGE_ID=${{ needs.version.outputs.version }}${{ matrix.suffix }}+${{ needs.version.outputs.commit }}
            ${{ matrix.cuda && format('BASE_IMAGE={0}', env[matrix.cuda_base]) || '' }}
          # A run that publishes pushes every image to GHCR. A dry run pushes none out: each stays in
          # the builder, but for the CUDA harnesses, which go to the job's own registry under a name
          # of that registry alone (the CUDA 12 one for the rig image below).
          tags: ${{ (matrix.cuda && env.PUBLISH != 'true') && format('{0}/{1}:dry-run{2}', env.DRY_RUN_REGISTRY, matrix.repository, matrix.suffix) || steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # An image either way, so the build reports its digest.
          outputs: type=image,push=${{ env.PUBLISH == 'true' || matrix.cuda }}
          # A release builds every layer again, so each image has its base's newest system
          # packages; any other run reads the cache.
          no-cache: ${{ env.RELEASE == 'true' }}
          cache-from: type=gha,scope=${{ matrix.key }}
          # The CUDA layers would crowd everything else out of the cache.
          cache-to: ${{ !matrix.cuda && format('type=gha,mode=max,scope={0}', matrix.key) || '' }}
      - name: Keep the image's digest for the bundle
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          KEY: ${{ matrix.key }}
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::The build reported no image digest."; exit 1 ;;
          esac
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$KEY"
          echo "$KEY: $DIGEST"
      # The one-container rig image, which RunPod pods run (containers/rig/Containerfile): the CUDA 12
      # harness just built, named by its digest (on GHCR for a run that publishes, in the job's own
      # registry for a dry run), with the supervisor's parts added. It keeps the harness's THERMITE_COMMIT and
      # THERMITE_IMAGE_ID. Tags, labels and annotations as for the other images, under thermite-rig.
      - id: rig-meta
        if: matrix.rig
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: "12"
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ needs.version.outputs.registry }}/thermite-rig
          flavor: |
            latest=false
            suffix=-cuda
          tags: |
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=thermite-rig
            org.opencontainers.image.description=${{ env.RIG_DESCRIPTION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
          annotations: |
            org.opencontainers.image.title=thermite-rig
            org.opencontainers.image.description=${{ env.RIG_DESCRIPTION }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ matrix.licenses }}
      - id: rig-build
        if: matrix.rig
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/rig/Containerfile
          platforms: linux/amd64
          build-args: |
            HARNESS_IMAGE=${{ env.PUBLISH == 'true' && needs.version.outputs.registry || env.DRY_RUN_REGISTRY }}/${{ matrix.repository }}@${{ steps.build.outputs.digest }}
          tags: ${{ steps.rig-meta.outputs.tags }}
          labels: ${{ steps.rig-meta.outputs.labels }}
          annotations: ${{ steps.rig-meta.outputs.annotations }}
          # An image either way, so the build reports its digest; pushed only by a run that publishes.
          outputs: type=image,push=${{ env.PUBLISH }}
      - name: Keep the rig image's digest for the bundle
        if: matrix.rig
        env:
          DIGEST: ${{ steps.rig-build.outputs.digest }}
        run: |
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::The rig image's build reported no image digest."; exit 1 ;;
          esac
          printf '%s\n' "$DIGEST" > digests/rig-cuda
          echo "rig-cuda: $DIGEST"
      # One file per image: the CUDA 12 job's holds the rig image's too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.key }}
          path: digests/
          if-no-files-found: error
          retention-days: 7

  # Each published image, pulled by digest with no sign-in from a runner that never signed in, and
  # held to src/release/checks.ts. The step summary lists every image with its digest.
  checks:
    name: image checks
    needs: [version, images]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The CUDA images are several gigabytes each: make room on the runner's disk first.
      - name: Make room for the CUDA images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Check each published image
        env:
          REGISTRY: ${{ needs.version.outputs.registry }}
        run: |
          node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/release/check-images.ts \
            --registry "$REGISTRY" \
            --commit "$GITHUB_SHA" --digests digests --summary "$GITHUB_STEP_SUMMARY"

  # A release's version tags, on the images that passed their checks: each tag is a copy of the
  # checked manifest (or index), so the version's tag and the commit's name the same digest.
  tag:
    name: version tags
    needs: [version, checks]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Tag each checked image with the version
        env:
          REGISTRY: ${{ needs.version.outputs.registry }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu
          tag() {
            docker buildx imagetools create --prefer-index=false \
              -t "$REGISTRY/$2:$VERSION$3" "$REGISTRY/$2@$(cat "digests/$1")"
            echo "$REGISTRY/$2:$VERSION$3 -> $(cat "digests/$1")"
          }
          tag control thermite-control ""
          tag harness thermite-harness ""
          tag harness-cuda thermite-harness -cuda
          tag harness-cuda13 thermite-harness -cuda13
          tag supervisor thermite-supervisor ""
          tag rig-cuda thermite-rig -cuda

  bundle:
    name: release bundle
    needs: [version, images, tag]
    # A dry run and a publish by hand have no tag job; a release's bundle waits for its tags.
    if: ${{ !cancelled() && needs.images.result == 'success' && (needs.version.outputs.release != 'true' || needs.tag.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      # The script needs no packages: only Node.js and the files in the repository. The version
      # comes from the tag's name, so it reaches the script as a variable, never as its text.
      - name: Write the bundle from the images' digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REGISTRY: ${{ needs.version.outputs.registry }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/release/bundle.ts \
            --version "$VERSION" \
            --registry "$REGISTRY" \
            --repo-url "$REPO_URL" \
            --digests digests --out bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: bundle/
          if-no-files-found: error
      # A draft: a maintainer reads it, then publishes it. Its notes are the readme, which gives
      # the compose file's SHA-256. A run again for the same tag replaces the files of the release
      # it made before, and its notes with them, so the SHA-256 is always the attached file's.
      - name: Attach the bundle to a draft release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bundle/compose.yaml bundle/README.md --clobber
            gh release edit "$TAG" --notes-file bundle/README.md
          else
            gh release create "$TAG" --draft --verify-tag --title "Thermite $TAG" \
              --notes-file bundle/README.md bundle/compose.yaml bundle/README.md
          fi
