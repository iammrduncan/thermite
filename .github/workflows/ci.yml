# On every pull request and every push to main and to the development branch (v1/build): the fast
# checks, the documentation site's build and checks, a secret scan of the history, then the compose
# smoke test: control and one rig built from this commit, a campaign assigned through control, a
# candidate judged. Beside it, the one-container rig image's acceptance, rigs on RunPod against
# the fake RunPod API, and the quick start as a tester follows it (on pull requests, only those
# that touch what it runs).
name: ci

on:
  pull_request:
  push:
    branches: [main, v1/build]

permissions:
  contents: read

# A new commit on a pull request cancels the run before it. Every push to main or v1/build gets a
# whole run of its own.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # One test file at a time: the judge's tests time real processes.
      - run: npm test
      # Generic patterns only here; maintainers' checkouts add a private denylist.
      - run: npm run check:public

  docs:
    name: docs site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/_site/package-lock.json
      # The root packages too: the docs check reads the real schemas from src/.
      - run: npm ci
      - run: npm run docs:install
      # The build fails on a page without a type or description, and on a broken link.
      - run: npm run docs:build
      - run: npm run docs:check

  # gitleaks over the whole history of the commit under test: its default rules, and the allowlists
  # for the made-up keys in .gitleaks.toml. Findings are printed with their values redacted.
  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # gitleaks_8.30.1_linux_x64.tar.gz, from gitleaks_8.30.1_checksums.txt in the release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --verbose \
            --log-opts="--full-history HEAD"

  compose-smoke:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:compose
        env:
          COMPOSE: docker compose

  # The one-container rig image (RunPod's), built on the CPU harness image and started as RunPod
  # starts it: enrollment by control in pull mode, its isolation selftest, restarts and a clean
  # stop.
  rig-image:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # The images build Thermite themselves; the script runs control's side of pull mode itself.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/rig-image-acceptance.mjs
        env:
          COMPOSE: docker compose

  # Rigs on RunPod against the fake RunPod API, with no RunPod and nothing paid: control in the
  # script launches a rig whose pod is a container of the one-container rig image, enrolls it,
  # takes its reports, then stops, starts and terminates it, its results sent to control first.
  runpod:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/runpod-acceptance.mjs
        env:
          COMPOSE: docker compose

  # Whether the quick start runs: always on a push, and on a pull request that changes one of these
  # paths (extended regular expressions, matched against each changed file's path).
  quick-start-paths:
    name: quick start, needed?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          # The images and compose files, the release bundle, the quick start's pages, the sample
          # and the smoke kit the rig's check runs, and this test itself.
          PATHS: |
            ^containers/
            ^compose[^/]*\.yaml$
            ^scripts/release-bundle\.ts$
            ^src/release/
            ^docs/_site/src/content/docs/tutorials/(first-run|agents-with-a-free-model)\.md$
            ^docs/_site/src/content/docs/how-to/install/one-machine\.md$
            ^docs/_site/src/content/docs/how-to/operate/troubleshoot\.md$
            ^examples/
            ^kits/smoke-cpu/
            ^scripts/quick-start-acceptance\.mjs$
            ^scripts/lib/
            ^src/testing/quick-start\.ts$
            ^\.github/workflows/ci\.yml$
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$PATHS" | sed '/^$/d' > "$RUNNER_TEMP/paths"
          matched=$(git diff --name-only "$BASE" HEAD | grep -E -f "$RUNNER_TEMP/paths" || true)
          if [ -n "$matched" ]; then
            echo "The quick start runs: this pull request changes"
            printf '%s\n' "$matched" | sed 's/^/  /'
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change here touches the quick start: it does not run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # The quick start on a clean runner, as a tester follows it (scripts/quick-start-acceptance.mjs):
  # this commit's images in a release bundle written by scripts/release-bundle.ts, init and up,
  # the rig's checks, thermite doctor, then the sample campaign in examples/matmul-cpu to the
  # judge's first verdict, with the scripted model of the agents acceptance (no key, no network
  # model). It reads its steps from the tutorials, so a page that breaks the quick start fails it.
  quick-start:
    needs: [checks, quick-start-paths]
    if: needs.quick-start-paths.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # Node.js for the test itself, and for `npm ci` in the tester's thermite-source folder.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/quick-start-acceptance.mjs
        env:
          COMPOSE: docker compose
      # What each check found, and how long each step took.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-start-report
          path: .dev/acceptance/
          if-no-files-found: ignore
          retention-days: 14
