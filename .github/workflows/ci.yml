# On every pull request and every push to main and to a version's branch (such as v0.1.1): the fast
# checks, the judge's tests on machines of their own, the documentation site's build and checks,
# the dashboard in headless Chrome and a secret scan of the history. The heavy jobs run only when the change touches what they test
# (the owner, 2026-10-24: "the heavy stuff should run before a version tag and release, not a
# commit and roll to lab"): the compose smoke test (control and one rig built from this commit, a
# campaign assigned through control, a candidate judged), the one-container rig image's
# acceptance, rigs on RunPod against the fake RunPod API, and the quick start as a tester follows
# it. On a version tag, and when run by hand, every job runs, and so does every other acceptance
# check a runner can run (tag-acceptance). The heavy jobs wait only for the short job that decides
# which of them run (heavy); the other jobs start once the run is approved.
#
# No run uses runners until a maintainer approves it (the owner, 2026-10-29: "prs require approval
# before running them"): the first job, approval, deploys to the repository's environment ci,
# whose required reviewers approve it, and every other job waits for it.
#
# Each action is pinned by its commit, with its version in a comment; Dependabot moves both
# (tests/release/workflows.test.ts holds every workflow to it).
name: ci

on:
  pull_request:
  push:
    branches: [main, "v[0-9]*"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request cancels the run before it. Every push to main or to a version's
# branch gets a whole run of its own.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Waits for a reviewer of the environment ci to approve the run; one approval starts every job.
  approval:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ci
    steps:
      - run: echo "Approved; the run's jobs start."

  checks:
    name: checks (Node ${{ matrix.node }})
    needs: approval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The dashboard's app has packages of its own (web/package-lock.json).
      - run: npm run web:install
      - run: npm run typecheck
      - run: npm run web:typecheck
      - run: npm run lint
      # Every test file but the judge's and the broker's, side by side: they run in the next job.
      - run: node scripts/test.mjs --part parallel
      # Generic patterns only here; maintainers' checkouts add a private denylist.
      - run: npm run check:public
      - run: npm run check:sizes
      - run: npm run check:imports
      - run: npm run check:loose-ends

  # The judge's and the broker's tests time real processes, so they run one file at a time, on a
  # machine with nothing else on it.
  judge-tests:
    name: judge tests (Node ${{ matrix.node }})
    needs: approval
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node scripts/test.mjs --part alone

  docs:
    name: docs site
    needs: approval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/_site/package-lock.json
      # The root packages too: the docs check reads the real schemas from src/.
      - run: npm ci
      - run: npm run docs:install
      # The build fails on a page without a type or description, and on a broken link.
      - run: npm run docs:build
      - run: npm run docs:check

  # The dashboard in headless Chrome (goal 239): New campaign filled in and sent as a person does,
  # and every kind of page at two widths, checked for errors and for layout. Then the dashboard's
  # app (goal 243), built here from web/: its sign-in, a change that shows with no reload, and
  # every screen at three widths, in light and in dark. No containers: control runs from the
  # source on the demo's data. The runner's own Google Chrome; nothing is downloaded, and the
  # browser reaches nothing but control. The report and every page's screenshot are kept when it
  # fails.
  browser:
    name: dashboard in a browser
    needs: approval
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run web:install
      - run: npm run acceptance:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-report
          path: .dev/acceptance/browser/
          if-no-files-found: ignore
          retention-days: 14

  # gitleaks over the whole history of the commit under test: its default rules, and the allowlists
  # for the made-up keys in .gitleaks.toml. Findings are printed with their values redacted.
  secrets:
    name: secret scan
    needs: approval
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # gitleaks_8.30.1_linux_x64.tar.gz, from gitleaks_8.30.1_checksums.txt in the release.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the history
        run: |
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --verbose \
            --log-opts="--full-history HEAD"

  compose-smoke:
    needs: heavy
    if: needs.heavy.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run smoke:compose
        env:
          COMPOSE: docker compose

  # The one-container rig image (RunPod's), built on the CPU harness image and started as RunPod
  # starts it: enrollment by control in pull mode, its isolation selftest, restarts and a clean
  # stop.
  rig-image:
    needs: heavy
    if: needs.heavy.outputs.rig_image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The images build Thermite themselves; the script runs control's side of pull mode itself.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The script pulls nothing: the message bus's image, as compose.yaml pins it.
      - run: docker pull "$(grep -m1 -oE 'docker\.io/library/nats:[^ ]+' compose.yaml)"
      - run: node scripts/acceptance/rig-image.mjs
        env:
          COMPOSE: docker compose

  # Rigs on RunPod against the fake RunPod API, with no RunPod and nothing paid: control in the
  # script launches a rig whose pod is a container of the one-container rig image, enrolls it,
  # takes its reports, then stops, starts and terminates it, its results sent to control first.
  runpod:
    needs: heavy
    if: needs.heavy.outputs.runpod == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The script pulls nothing: the message bus's image, as compose.yaml pins it.
      - run: docker pull "$(grep -m1 -oE 'docker\.io/library/nats:[^ ]+' compose.yaml)"
      - run: node scripts/acceptance/runpod.mjs
        env:
          COMPOSE: docker compose

  # Which heavy jobs run: every one on a version tag and when run by hand; on a push or a pull
  # request, each one whose paths (extended regular expressions, matched against each changed
  # file's path) the change touches.
  heavy:
    name: heavy checks, needed?
    needs: approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      compose: ${{ steps.paths.outputs.compose }}
      rig_image: ${{ steps.paths.outputs.rig_image }}
      runpod: ${{ steps.paths.outputs.runpod }}
      quick_start: ${{ steps.paths.outputs.quick_start }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          # Each path of code names a folder, or a module by its name: the file and the folder it
          # becomes when it splits (`^src/core/paths(\.ts$|/)`), so a split or a move into a
          # folder keeps the job running (tests/release/workflows.test.ts holds it).
          #
          # The containers and compose files, the dashboard's app that control's image builds,
          # the APIs, the relay and the message bus it goes over, the advisors' runner, and the
          # smoke test.
          COMPOSE: |
            ^containers/
            ^web/
            ^compose[^/]*\.yaml$
            ^package(-lock)?\.json$
            ^kits/smoke-cpu/
            ^src/(control|harness)/api/
            ^src/(control|harness|supervisor)/main(\.ts$|/)
            ^src/harness/controller/
            ^src/supervisor/relay/
            ^src/(common|control)/bus/
            ^src/core/link/
            ^src/supervisor/advisor-runs/
            ^src/common/run-as/
            ^scripts/acceptance/compose-smoke(\.mjs$|/)
            ^scripts/acceptance/lib/
            ^\.github/workflows/ci\.yml$
          # The rig image and the harness image under it (their Containerfiles and the scripts they
          # run), the broker, the isolation selftest, the advisors' runner, pull mode's enrollment,
          # and the message bus with the pod's leaf node.
          RIG_IMAGE: |
            ^containers/(Containerfile$|build/|harness/|rig/)
            ^package(-lock)?\.json$
            ^src/harness/broker/
            ^tests/harness/broker/
            ^src/harness/selftest/
            ^src/supervisor/advisor-runs/
            ^src/common/run-as/
            ^src/core/(tunnel|paths)(\.ts$|/)
            ^src/control/runpod/tunnel(\.ts$|/)
            ^src/(common|control)/bus/
            ^src/core/link/
            ^src/supervisor/leaf(\.ts$|/)
            ^scripts/acceptance/rig-image(\.mjs$|/)
            ^scripts/acceptance/lib/
            ^\.github/workflows/ci\.yml$
          # Rigs on RunPod, pull mode, results sent to control, the message bus with the pod's leaf
          # node, and the rig image with the harness image under it.
          RUNPOD: |
            ^src/control/runpod/
            ^tests/control/runpod/
            ^tests/control/dashboard/runpod(\.test\.ts$|/)
            ^src/control/exports(\.ts$|/)
            ^src/control/store/(runpod|tunnels|exports)(\.ts$|/)
            ^src/core/(tunnel|paths)(\.ts$|/)
            ^src/supervisor/export-upload(\.ts$|/)
            ^src/supervisor/relay/
            ^src/(common|control)/bus/
            ^src/core/link/
            ^src/supervisor/leaf(\.ts$|/)
            ^tests/helpers/fake-runpod(\.ts$|/)
            ^containers/(Containerfile$|build/|harness/|rig/)
            ^scripts/acceptance/runpod(\.mjs$|/)
            ^scripts/acceptance/lib/
            ^\.github/workflows/ci\.yml$
          # The images and compose files, the release bundle, the quick start's pages, the sample
          # and the smoke kit the rig's check runs, and this test itself.
          QUICK_START: |
            ^containers/
            ^web/
            ^compose[^/]*\.yaml$
            ^scripts/release/bundle(\.ts$|/)
            ^src/release/
            ^tests/release/
            ^docs/_site/src/content/docs/tutorials/(first-run|agents-with-a-free-model)\.md$
            ^docs/_site/src/content/docs/how-to/install/one-machine\.md$
            ^docs/_site/src/content/docs/how-to/operate/troubleshoot\.md$
            ^examples/
            ^kits/smoke-cpu/
            ^scripts/acceptance/quick-start(\.mjs$|/)
            ^scripts/acceptance/lib/
            ^tests/helpers/quick-start(\.ts$|/)
            ^tests/docs/quick-start(\.test\.ts$|/)
            ^\.github/workflows/ci\.yml$
        run: |
          all=
          case "$EVENT" in
            pull_request) from=$BASE ;;
            push) from=$BEFORE ;;
            *) all=yes ;;
          esac
          # A tag, a new branch or a history that was rewritten: no change to compare, so all.
          if [ "$REF_TYPE" = tag ] || ! git cat-file -e "${from:-none}^{commit}" 2>/dev/null; then
            all=yes
          fi
          [ -z "$all" ] && git diff --name-only "$from" HEAD > "$RUNNER_TEMP/changed"
          for job in compose rig_image runpod quick_start; do
            if [ -n "$all" ]; then
              echo "$job runs: a version tag, a run by hand or no change to compare"
              echo "$job=true" >> "$GITHUB_OUTPUT"
              continue
            fi
            var=$(echo "$job" | tr a-z A-Z)
            printenv "$var" | sed '/^$/d' > "$RUNNER_TEMP/paths"
            matched=$(grep -E -f "$RUNNER_TEMP/paths" "$RUNNER_TEMP/changed" || true)
            if [ -n "$matched" ]; then
              echo "$job runs: the change touches"
              printf '%s\n' "$matched" | sed 's/^/  /'
              echo "$job=true" >> "$GITHUB_OUTPUT"
            else
              echo "$job does not run: no change here touches what it tests"
              echo "$job=false" >> "$GITHUB_OUTPUT"
            fi
          done

  # The quick start on a clean runner, as a tester follows it (scripts/acceptance/quick-start.mjs):
  # this commit's images in a release bundle written by scripts/release/bundle.ts, init and up,
  # the rig's checks, thermite doctor, then the sample campaign in examples/matmul-cpu to the
  # judge's first verdict, with the scripted model of the agents acceptance (no key, no network
  # model). It reads its steps from the tutorials, so a page that breaks the quick start fails it.
  quick-start:
    needs: heavy
    if: needs.heavy.outputs.quick_start == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node.js for the test itself, and for `npm ci` in the tester's thermite-source folder.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/acceptance/quick-start.mjs
        env:
          COMPOSE: docker compose
      # What each check found, and how long each step took.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quick-start-report
          path: .dev/acceptance/
          if-no-files-found: ignore
          retention-days: 14

  # On a version tag, and when run by hand, every other acceptance check a runner can run, each on
  # a machine of its own (the owner's answer to the clean-up guide's question 20): the judge's
  # adversarial set (judge: the smoke campaign's candidates with isolation, tamper, crash-recovery
  # and A/A checks), control with two rigs, a new campaign, machines over SSH, four fake GPUs, the
  # agents and each agent program's stand-in, the real Claude Code against a stand-in API, the
  # terminal host, backup and restore, steering, and the message bus with its leaf nodes. Not
  # here: the cluster and rig deploy checks, which need Podman itself (kind on Podman, rootless
  # Podman in a systemd stand-in), and the paid RunPod check, which spends money.
  tag-acceptance:
    name: acceptance (${{ matrix.check }})
    needs: approval
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check:
          - judge
          - control
          - campaign
          - machine
          - multigpu
          - agents
          - claude
          - claude-real
          - codex
          - terminal
          - backup
          - steering
          - bus
          - leaf
    env:
      CHECK: ${{ matrix.check }}
      COMPOSE: docker compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The bus and leaf checks pull nothing: the message bus's image, as compose.yaml pins it.
      - if: matrix.check == 'bus' || matrix.check == 'leaf'
        run: docker pull "$(grep -m1 -oE 'docker\.io/library/nats:[^ ]+' compose.yaml)"
      - run: node "scripts/acceptance/$CHECK.mjs"
      # What the checks that write a report found.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: acceptance-${{ matrix.check }}
          path: .dev/acceptance/
          if-no-files-found: ignore
          retention-days: 14
