# Dependabot version updates, once a week: Thermite's own packages, the dashboard app's packages,
# the documentation site's packages and the GitHub Actions in the workflows. Minor and patch
# updates come grouped in one pull request per ecosystem; each major update comes alone. Starlight
# is still 0.x, where a minor version can break the site, so it always comes alone (see
# docs/writing-docs.md). @types/node gets no major update: its major is the Node.js version
# Thermite supports (package.json's engines), and a newer one's types would let code use what that
# Node.js does not have. The pull requests go to main, as every pull request does
# (docs/plan/decisions.md, Releases and planning): a branch that stays, so none is moved when a
# version ships, and the maintainers take each into the version it fits. Dependabot reads this
# file from main.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    target-branch: main
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /docs/_site
    target-branch: main
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ["@astrojs/starlight"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
