<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Thermite v1 — Interactive UI Mockups (Magnesium)</title>
<style>
/* ==========================================================================
   @iammrduncan/magnesium — Thermite Preset Tokens (Light & Dark)
   Zero external fonts/CDNs; works offline via file:// and HTTP.
   ========================================================================== */
:root {
  --font-sans: "Geist Variable", "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
  --font-mono: "Geist Mono Variable", "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-xl: 14px;
  --radius-pill: 999px;

  /* Review chrome backdrop (outside simulated app frame) */
  --stage-bg: #ebe8e3;
  --chrome-bg: #171412;
  --chrome-surface: #26221e;
  --chrome-border: #34302c;
  --chrome-text: #fafaf9;
  --chrome-quiet: #a8a29e;
  --chrome-flame: #fb923c;

  /* App tokens — Light (Magnesium Thermite preset) */
  --background: #ffffff;
  --foreground: #1c1917;
  --card: #ffffff;
  --sidebar: #faf9f7;
  --muted: #f3f1ee;
  --soft: #44403c;
  --quiet: #6f6862;
  --border: #e7e5e4;
  --input: #d6d3d1;
  --primary: #c2410c;
  --primary-hover: #a8370a;
  --primary-foreground: #ffffff;
  --flame: #c2410c;
  --flame-tint: #fff3ec;
  --ember: #f2542d;
  --ember-light: #ff8a3d;

  --good: #15803d;
  --good-tint: #eefaf2;
  --good-edge: #bbf7d0;
  --working: #1d4ed8;
  --working-tint: #e8effe;
  --working-edge: #bfdbfe;
  --needs: #b45309;
  --needs-tint: #fdf3e2;
  --needs-card: #fffaf0;
  --needs-edge: #f1dcae;
  --wrong: #b91c1c;
  --wrong-tint: #fdecec;
  --wrong-edge: #f3caca;
  --idle: #57534e;
  --idle-tint: #f1efec;
  --idle-mark: #a8a29e;
  --idle-bar: #78716c;
  --grid: #efedea;

  --code-bg: #faf9f7;
  --diff-add-bg: #ecfdf3;
  --diff-add-ink: #166534;
  --diff-del-bg: #fef2f2;
  --diff-del-ink: #991b1b;

  --toast-bg: #1c1917;
  --toast-fg: #ffffff;
  --shadow-button: 0 1px 0 rgb(28 25 23 / 0.08);
  --shadow-dialog: 0 16px 40px rgb(28 25 23 / 0.16);
  --shadow-frame: 0 8px 32px rgb(28 25 23 / 0.09);
  --scrim: rgb(28 25 23 / 0.36);
}

html[data-theme="dark"] {
  --stage-bg: #0f0d0b;
  --background: #211d1a;
  --foreground: #fafaf9;
  --card: #211d1a;
  --sidebar: #171412;
  --muted: #2e2925;
  --soft: #d6d3d1;
  --quiet: #a8a29e;
  --border: #34302c;
  --input: #4a4541;
  --primary: #c2410c;
  --primary-hover: #d84b10;
  --primary-foreground: #ffffff;
  --flame: #fb923c;
  --flame-tint: #3a1d10;

  --good: #4ade80;
  --good-tint: #12281a;
  --good-edge: #1e462d;
  --working: #60a5fa;
  --working-tint: #16223b;
  --working-edge: #243b6b;
  --needs: #fbbf24;
  --needs-tint: #2e2110;
  --needs-card: #2a1f0e;
  --needs-edge: #4d3c18;
  --wrong: #f87171;
  --wrong-tint: #2f1717;
  --wrong-edge: #5c2626;
  --idle: #a8a29e;
  --idle-tint: #2e2925;
  --idle-mark: #78716c;
  --idle-bar: #8c857e;
  --grid: #34302c;

  --code-bg: #171412;
  --diff-add-bg: #12281a;
  --diff-add-ink: #86efac;
  --diff-del-bg: #2f1717;
  --diff-del-ink: #fca5a5;

  --toast-bg: #fafaf9;
  --toast-fg: #1c1917;
  --shadow-button: 0 1px 0 rgb(0 0 0 / 0.3);
  --shadow-dialog: 0 20px 48px rgb(0 0 0 / 0.55);
  --shadow-frame: 0 10px 36px rgb(0 0 0 / 0.45);
  --scrim: rgb(0 0 0 / 0.56);
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  color: var(--foreground);
  background: var(--stage-bg);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
.mono { font-family: var(--font-mono); }
.tabular { font-variant-numeric: tabular-nums; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

/* ==========================================================================
   Prototype Review Chrome (Top Bar)
   ========================================================================== */
.review-bar {
  position: sticky;
  top: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 46px;
  padding: 6px 10px;
  background: var(--chrome-bg);
  border-bottom: 1px solid var(--chrome-border);
  color: var(--chrome-text);
  flex-wrap: wrap;
}
.review-brand {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  font-size: 12.5px;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.review-sub {
  font-size: 10.5px;
  font-weight: 400;
  color: var(--chrome-quiet);
  padding: 2px 5px;
  border-radius: 4px;
  background: var(--chrome-surface);
  border: 1px solid var(--chrome-border);
}
.review-screens {
  display: flex;
  align-items: center;
  gap: 2px;
  overflow-x: auto;
  scrollbar-width: none;
  flex: 1 1 auto;
  min-width: 0;
}
.review-screens::-webkit-scrollbar { display: none; }
.review-tab {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 7px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--chrome-quiet);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
  cursor: pointer;
  transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
}
.review-tab:hover { background: var(--chrome-surface); color: var(--chrome-text); }
.review-tab[aria-selected="true"] {
  background: var(--chrome-surface);
  border-color: #4a4541;
  color: var(--chrome-text);
  font-weight: 600;
}
.review-tab .num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--chrome-quiet);
}
.review-tab[aria-selected="true"] .num { color: var(--chrome-flame); }

.review-controls {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
  flex-wrap: wrap;
  max-width: 100%;
}
.seg-dark {
  display: inline-flex;
  background: var(--chrome-surface);
  border: 1px solid var(--chrome-border);
  border-radius: 6px;
  padding: 2px;
  gap: 2px;
}
.seg-dark button {
  height: 24px;
  padding: 0 6px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--chrome-quiet);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.seg-dark button:hover { color: var(--chrome-text); }
.seg-dark button[aria-pressed="true"] {
  background: #3a3530;
  color: var(--chrome-text);
  font-weight: 600;
}
.chrome-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 28px;
  padding: 0 8px;
  border-radius: 6px;
  border: 1px solid var(--chrome-border);
  background: var(--chrome-surface);
  color: var(--chrome-text);
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.chrome-btn:hover { border-color: #57524d; background: #312c27; }
.chrome-link {
  color: var(--chrome-flame);
  border-color: #4b3123;
  background: #281b14;
}
.chrome-link:hover { background: #362218; border-color: #7c3a1d; }

/* ==========================================================================
   Preview Stage & Responsive Device Frame
   ========================================================================== */
.preview-stage {
  display: flex;
  justify-content: center;
  padding: 12px;
  min-height: calc(100dvh - 48px);
}
.device-frame {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 1440px;
  min-height: calc(100dvh - 72px);
  background: var(--background);
  color: var(--foreground);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-frame);
  overflow: hidden;
  transition: width 180ms ease;
}
.device-frame.viewport-tablet {
  width: 820px;
  max-width: 100%;
}
.device-frame.viewport-mobile {
  width: 390px;
  max-width: 100%;
  height: 820px;
  min-height: 680px;
  max-height: calc(100dvh - 72px);
  border-radius: 22px;
  border-width: 2px;
}

/* ==========================================================================
   Thermite Brand Mark & Icons
   ========================================================================== */
.mark {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: linear-gradient(160deg, var(--ember-light), var(--ember));
  color: #ffffff;
  flex-shrink: 0;
}
.icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.75;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.icon-sm { width: 14px; height: 14px; }

/* ==========================================================================
   App Frame (Sidebar + Inset)
   ========================================================================== */
.app-shell {
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
  position: relative;
  overflow: hidden;
}
.app-sidebar {
  width: 236px;
  flex: 0 0 236px;
  display: flex;
  flex-direction: column;
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  min-height: 0;
  z-index: 20;
}
.sidebar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 12px 10px;
}
.sidebar-brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.015em;
  padding: 4px 6px;
  border-radius: var(--radius-md);
}
.sidebar-nav {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 4px 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sidebar-foot {
  padding: 8px 8px 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-row {
  display: flex;
  align-items: center;
  gap: 4px;
}
.nav-line {
  display: flex;
  align-items: center;
  gap: 9px;
  height: 36px;
  padding: 0 9px;
  border-radius: var(--radius-md);
  border: 0;
  background: transparent;
  width: 100%;
  text-align: left;
  font-size: 14px;
  color: var(--foreground);
  cursor: pointer;
  min-width: 0;
  transition: background 110ms ease;
}
.nav-line:hover { background: var(--muted); }
.nav-line .icon { color: var(--quiet); }
.nav-line.active {
  background: var(--flame-tint);
  color: var(--flame);
  font-weight: 600;
}
.nav-line.active .icon { color: var(--flame); }
.nav-plus {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  border: 0;
  background: transparent;
  color: var(--quiet);
  cursor: pointer;
  flex-shrink: 0;
}
.nav-plus:hover { background: var(--muted); color: var(--foreground); }
.nav-group-sep {
  height: 1px;
  background: var(--border);
  margin: 8px 6px;
}
.nav-list {
  list-style: none;
  margin: 2px 0 0 16px;
  padding: 0 0 0 8px;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 34px;
  padding: 0 8px;
  border-radius: var(--radius-md);
  border: 0;
  background: transparent;
  width: 100%;
  text-align: left;
  font-size: 13.5px;
  color: var(--soft);
  cursor: pointer;
  min-width: 0;
}
.nav-item:hover { background: var(--muted); color: var(--foreground); }
.nav-item.active { background: var(--flame-tint); color: var(--flame); font-weight: 600; }
.nav-delta {
  margin-left: auto;
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.avatar-badge {
  width: 20px;
  height: 20px;
  border-radius: 999px;
  background: var(--foreground);
  color: var(--background);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  flex-shrink: 0;
}

/* Mobile / Tablet Topbar + Drawer behavior */
.mobile-bar {
  display: none;
  height: 52px;
  flex-shrink: 0;
  align-items: center;
  gap: 10px;
  padding: 0 12px;
  background: var(--sidebar);
  border-bottom: 1px solid var(--border);
}
.sidebar-scrim {
  display: none;
  position: absolute;
  inset: 0;
  background: var(--scrim);
  z-index: 25;
}
.viewport-tablet .mobile-bar,
.viewport-mobile .mobile-bar { display: flex; }
.viewport-tablet .app-sidebar,
.viewport-mobile .app-sidebar {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  transform: translateX(-100%);
  transition: transform 180ms ease;
  box-shadow: var(--shadow-dialog);
  z-index: 30;
}
.viewport-tablet .app-shell.drawer-open .app-sidebar,
.viewport-mobile .app-shell.drawer-open .app-sidebar { transform: translateX(0); }
.viewport-tablet .app-shell.drawer-open .sidebar-scrim,
.viewport-mobile .app-shell.drawer-open .sidebar-scrim { display: block; }

@media (max-width: 960px) {
  .mobile-bar { display: flex; }
  .app-sidebar {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    transform: translateX(-100%);
    transition: transform 180ms ease;
    box-shadow: var(--shadow-dialog);
    z-index: 30;
  }
  .app-shell.drawer-open .app-sidebar { transform: translateX(0); }
  .app-shell.drawer-open .sidebar-scrim { display: block; }
}

.app-main-wrap {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.app-scroll {
  flex: 1 1 auto;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
}

/* ==========================================================================
   Shared Magnesium Components (Buttons, Chips, Cards, Inputs, Tabs)
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 36px;
  padding: 0 13px;
  border-radius: var(--radius-md);
  border: 1px solid var(--input);
  background: var(--background);
  color: var(--foreground);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background 110ms ease, border-color 110ms ease, color 110ms ease;
}
.btn:hover { background: var(--muted); }
.btn:focus-visible, .nav-line:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--flame);
  outline-offset: 1px;
}
.btn-sm { height: 30px; padding: 0 10px; font-size: 12.5px; gap: 5px; }
.btn-xs { height: 26px; padding: 0 8px; font-size: 12px; gap: 4px; }
.btn-icon { width: 34px; height: 34px; padding: 0; }
.btn-main {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-foreground);
  box-shadow: var(--shadow-button);
}
.btn-main:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--soft); }
.btn-ghost:hover { background: var(--muted); color: var(--foreground); }
.btn-danger {
  border-color: var(--wrong-edge);
  color: var(--wrong);
  background: var(--background);
}
.btn-danger:hover { background: var(--wrong-tint); }
.btn-link {
  border: 0;
  background: transparent;
  padding: 0;
  height: auto;
  color: var(--flame);
  font-weight: 600;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: color-mix(in srgb, var(--flame) 40%, transparent);
}
.btn-link:hover { text-decoration-color: var(--flame); background: transparent; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 23px;
  padding: 0 8px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}
.chip-good { background: var(--good-tint); color: var(--good); }
.chip-working { background: var(--working-tint); color: var(--working); }
.chip-needs { background: var(--needs-tint); color: var(--needs); }
.chip-wrong { background: var(--wrong-tint); color: var(--wrong); }
.chip-idle { background: var(--idle-tint); color: var(--idle); }
.chip-flame { background: var(--flame-tint); color: var(--flame); }

.dot {
  width: 7px;
  height: 7px;
  border-radius: 999px;
  flex-shrink: 0;
  display: inline-block;
}
.dot-good { background: var(--good); }
.dot-working { background: var(--working); }
.dot-needs { background: var(--needs); }
.dot-wrong { background: var(--wrong); }
.dot-idle { background: var(--idle-mark); }

.count-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--needs-tint);
  color: var(--needs);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  margin-left: auto;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
}
.card-pad { padding: 16px; }
.needs-card {
  background: var(--needs-card);
  border: 1px solid var(--needs-edge);
  border-radius: var(--radius-xl);
  padding: 14px 16px;
}

.field-label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--foreground);
  margin-bottom: 5px;
}
.field-hint {
  font-size: 12px;
  color: var(--quiet);
  margin-top: 4px;
}
.input, .select, .textarea {
  width: 100%;
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  background: var(--background);
  color: var(--foreground);
  padding: 0 11px;
  height: 36px;
  font-size: 14px;
  transition: border-color 110ms ease;
}
.textarea {
  height: auto;
  padding: 9px 11px;
  resize: vertical;
  line-height: 1.45;
}
.viewport-mobile .input,
.viewport-mobile .select,
.viewport-mobile .textarea { font-size: 16px; }

.seg {
  display: inline-flex;
  align-items: center;
  background: var(--muted);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 2px;
  gap: 2px;
  max-width: 100%;
  flex-wrap: wrap;
}
.seg button {
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--quiet);
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.viewport-mobile .seg button {
  padding: 0 8px;
  font-size: 11.5px;
}
.seg button:hover { color: var(--foreground); }
.seg button[aria-pressed="true"] {
  background: var(--background);
  color: var(--foreground);
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
}

.switch-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--input);
  background: var(--background);
  border-radius: var(--radius-md);
  height: 32px;
  padding: 0 10px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}
.switch-track {
  width: 28px;
  height: 16px;
  border-radius: 999px;
  background: var(--input);
  position: relative;
  transition: background 120ms ease;
  flex-shrink: 0;
}
.switch-thumb {
  width: 12px;
  height: 12px;
  border-radius: 999px;
  background: #ffffff;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: transform 120ms ease;
}
.switch-btn[aria-checked="true"] .switch-track { background: var(--good); }
.switch-btn[aria-checked="true"] .switch-thumb { transform: translateX(12px); }
.switch-btn[aria-checked="true"] { border-color: var(--good-edge); background: var(--good-tint); color: var(--good); }

.tabs-bar {
  display: flex;
  align-items: center;
  gap: 18px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}

}

.section-head {

}

/* ==========================================================================

/* ==========================================================================

.run-row-viz { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.viewport-mobile .run-row-viz { justify-content: space-between; }

/* ==========================================================================
   Screen 3: Run Workspace (Direction A Split Workbench & Direction B Stream)
   ========================================================================== */
.run-topbar {

}

.run-head-line {

  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.run-actions-cluster {
  margin-left: auto;

  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.dir-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;

  flex-wrap: wrap;

}

/* Direction A: Split Workbench */
.workbench-split {
  display: flex;
  flex: 1 1 auto;
  min-height: 0;
  overflow: hidden;
  position: relative;
}
.workbench-canvas {
  flex: 1 1 auto;
  min-width: 0;
  overflow-y: auto;
  padding: 16px 20px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.resize-gutter {
  width: 9px;

  align-items: center;
  justify-content: center;
  user-select: none;
}
.resize-gutter::before {
  content: "";

  height: 100%;

}
.resize-gutter:hover::before,
.resize-gutter.dragging::before {
  width: 3px;
  background: var(--flame);
}
.beside-pane {
  width: 416px;
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: var(--background);
  overflow: hidden;
}
.viewport-tablet .resize-gutter,
.viewport-mobile .resize-gutter { display: none; }
.viewport-tablet .beside-pane,
.viewport-mobile .beside-pane {
  position: absolute;
  inset: 0;
  width: 100% !important;
  z-index: 18;
  transform: translateX(100%);
  transition: transform 180ms ease;
  border-left: 1px solid var(--border);
}
.viewport-tablet .beside-pane.mobile-open,
.viewport-mobile .beside-pane.mobile-open { transform: translateX(0); }

.mobile-inspector-btn { display: none; }
.viewport-tablet .mobile-inspector-btn,
.viewport-mobile .mobile-inspector-btn { display: inline-flex; }

.beside-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 14px;
  border-bottom: 1px solid var(--border);
  background: var(--sidebar);
  flex-shrink: 0;
}
.viewport-mobile .beside-head { padding: 0 10px; gap: 6px; }
.viewport-mobile .beside-head .tabs-bar { gap: 11px; }
.viewport-mobile .beside-head .tab-btn { font-size: 12.5px; }
.beside-body {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Attempts table */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.data-table th {
  text-align: left;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--quiet);
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);

}
.data-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);

}
.data-table tbody tr { cursor: pointer; transition: background 90ms ease; }
.data-table tbody tr:hover { background: var(--muted); }
.data-table tbody tr.selected { background: var(--flame-tint); }
.viewport-mobile .col-hide-sm { display: none; }

/* Trace Steps (fxbot style) */
.trace-list { display: flex; flex-direction: column; gap: 6px; }
.trace-item {
  border: 1px solid var(--border);

}
.trace-summary {
  display: flex;
  align-items: center;

  font-size: 13px;
}
.trace-summary:hover { background: var(--muted); }
.trace-detail {
  padding: 8px 11px 10px;
  border-top: 1px solid var(--border);
  background: var(--code-bg);
  font-size: 12px;
  color: var(--soft);

  word-break: break-word;
}

/* Unified diff block */
.diff-box {
  border: 1px solid var(--border);
  border-radius: 10px;

}
.diff-header {
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  background: var(--sidebar);
  font-size: 11.5px;
  color: var(--quiet);

  justify-content: space-between;
  gap: 8px;
}
.diff-line {
  display: flex;
  padding: 0 10px;
  white-space: pre-wrap;
  word-break: break-word;
}
.diff-ln {
  width: 32px;
  flex-shrink: 0;
  color: var(--quiet);
  user-select: none;
  font-size: 11px;
}
.diff-add { background: var(--diff-add-bg); color: var(--diff-add-ink); }
.diff-del { background: var(--diff-del-bg); color: var(--diff-del-ink); }

/* Breaker health strip */
.breaker-strip {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 9px 12px;
  border-radius: 10px;

}

/* Direction B: Focused Stream */
.stream-wrap {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;

}
.stream-scroll {

}

.stream-col {

  gap: 14px;
}
.telemetry-ribbon {
  display: flex;
  align-items: center;

}
.feed-card {

}

}
.gain-bar-track {

}

.steer-rail {

  border-top: 1px solid var(--border);

}
.steer-rail-inner {

}
.viewport-mobile .steer-rail-inner { flex-wrap: wrap; }

/* Slide-over drawer (Direction B + Home Decision Inspector) */
.drawer-scrim {
  position: absolute;

  z-index: 35;
  display: none;
  justify-content: flex-end;
}

.slide-drawer {
  width: 470px;

  height: 100%;

}

/* ==========================================================================
   Screen 4: New Campaign (1-Page Sticky Wizard + Live YAML)
   ========================================================================== */
.campaign-grid {
  display: grid;

  align-items: start;
}

.viewport-tablet .campaign-grid,

}

.viewport-mobile .sticky-aside { position: static; }
.yaml-pre {

  font-family: var(--font-mono);

.radio-cards {

}

.radio-card {
  padding: 8px 10px;
  border-radius: 8px;

  background: var(--background);
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.radio-card:hover { background: var(--muted); }
.radio-card.selected {
  border-color: var(--flame);
  background: var(--flame-tint);
}
.preflight-list {

  padding: 0;

  flex-direction: column;
  gap: 7px;
  font-size: 12.5px;
}

/* ==========================================================================
   Screen 5: Compute (machine > device Pool + Add Machine Modal)
   ========================================================================== */
.machine-card {
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--background);
  overflow: hidden;
}
.machine-head {

}
.device-row:first-child { border-top: 0; }
.wall-badge {

  border-radius: 6px;

  font-family: var(--font-mono);

  color: var(--soft);
}
.util-track {
  width: 68px;
  height: 6px;
  border-radius: 999px;
  background: var(--muted);
  overflow: hidden;
}
.util-fill { height: 100%; background: var(--working); border-radius: 999px; }

/* Modal inside device-frame */
.modal-scrim {
  position: absolute;
  inset: 0;
  background: var(--scrim);
  z-index: 45;
  display: none;
  align-items: center;
  justify-content: center;

}

.modal-box {

.viewport-mobile .modal-box {

}
.cmd-box {
  padding: 10px 12px;
  border-radius: 9px;
  border: 1px solid var(--border);

  font-family: var(--font-mono);
  font-size: 12px;

}

/* ==========================================================================
   Screen 6: Knowledge & Setup (Tree + PG 18 FTS + SettingsShell)
   ========================================================================== */
.kb-grid {

  grid-template-columns: 248px minmax(0, 1fr);

}

.tree-box {

.tree-row {
  display: flex;

  padding-right: 8px;
  border-radius: 6px;
  border: 0;

  text-align: left;
  font-size: 13px;
  color: var(--soft);

}
.tree-row:hover { background: var(--muted); color: var(--foreground); }

.settings-shell {

.settings-rail {

  flex-direction: column;

}
.viewport-mobile .settings-rail,
.viewport-tablet .settings-rail {

  padding-bottom: 2px;
}
.settings-rail::-webkit-scrollbar { display: none; }
.settings-rail button {
  display: inline-flex;
  align-items: center;

  border-radius: var(--radius-md);

  background: transparent;
  color: var(--soft);

}
.settings-rail button:hover { background: var(--muted); color: var(--foreground); }

/* Toast with Undo */

  bottom: 16px;
  right: 16px;
  z-index: 55;

  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 10px;

/* Native viewport media queries (mirror simulated 820px / 390px modes when opened directly on tablet/mobile) */
@media (max-width: 960px) {
  .preview-stage { padding: 8px; }
  .resize-gutter { display: none; }
  .beside-pane {
    position: absolute;

    width: 100% !important;
    z-index: 18;
    transform: translateX(100%);

    border-left: 1px solid var(--border);

  .beside-pane.mobile-open { transform: translateX(0); }
  .mobile-inspector-btn { display: inline-flex; }
  .campaign-grid, .kb-grid, .settings-shell { grid-template-columns: minmax(0, 1fr); }
  .sticky-aside { position: static; }
  .settings-rail {

@media (max-width: 600px) {

  .review-bar { padding: 6px 10px; gap: 6px; }
  .review-controls { gap: 4px; width: 100%; }
  .seg-dark button { padding: 0 6px; font-size: 11px; }
  .chrome-btn { padding: 0 7px; font-size: 11.5px; }
  .page-pad { padding: 14px 12px 30px; gap: 16px; }
  .onboarding-wrap { padding: 16px 12px 28px; }
  .onboard-card { padding: 18px 14px; border-radius: 14px; }
  .provider-grid { grid-template-columns: 1fr 1fr; }
  .launch-cards, .form-row-2 { grid-template-columns: 1fr; }
  .radio-cards { grid-template-columns: repeat(2, 1fr); }
  .run-row-card { flex-direction: column; align-items: stretch; gap: 10px; }
  .run-row-viz { justify-content: space-between; }
  .run-topbar { padding: 10px 12px; }
  .run-actions-cluster { margin-left: 0; width: 100%; }
  .dir-bar { padding: 6px 12px; }
  .workbench-canvas, .stream-scroll { padding: 12px; }
  .col-hide-sm { display: none; }
  .steer-rail-inner { flex-wrap: wrap; }
  .seg button { padding: 0 8px; font-size: 11.5px; }
  .beside-head { padding: 0 10px; gap: 6px; }
  .beside-head .tabs-bar { gap: 11px; }
  .beside-head .tab-btn { font-size: 12.5px; }
  .modal-scrim { padding: 0; align-items: flex-end; }
  .modal-box { max-width: 100%; max-height: 92%; border-radius: 16px 16px 0 0; padding: 18px 16px; }
  .input, .select, .textarea { font-size: 16px; }
}

    if (state.expWindow === '1h') return { startMs: latestMs - 60 * 60000, endMs: latestMs + 5000 };
    if (state.expWindow === '6h') return { startMs: latestMs - 6 * 3600000, endMs: latestMs + 5000 };
    if (state.expWindow === '24h') return { startMs: latestMs - 24 * 3600000, endMs: latestMs + 5000 };
    return { startMs: earliestMs - 10 * 60000, endMs: latestMs + 5000 };
  }

  function matchFieldVal(ev, key, val) {
    const v = String(val).toLowerCase();
    if (key === 'run') return ev.run.toLowerCase() === v || ev.runId.toLowerCase() === v;
    if (key === 'kind') return ev.kind.toLowerCase() === v;
    if (key === 'verdict' || key === 'state') return ev.verdict.toLowerCase() === v;
    if (key === 'model') return !!ev.model && (ev.modelShort.toLowerCase() === v || ev.model.toLowerCase().includes(v));
    if (key === 'machine' || key === 'device') return ev.machine.toLowerCase() === v || ev.machineDevice.toLowerCase() === v || ev.device.toLowerCase() === v;
    if (key === 'wall') return ev.wall.toLowerCase() === v;
    if (key === 'attempt') return ev.attempt != null && String(ev.attempt) === v.replace(/^#/, '');
    if (key === 'lane') return !!ev.lane && ev.lane.toLowerCase() === v;
    if (key === 'harness') return !!ev.harness && ev.harness.toLowerCase() === v;
    if (key === 'exit_code') return ev.exitCode != null && String(ev.exitCode) === v;
    if (key === 'git_mode') return !!ev.gitMode && ev.gitMode.toLowerCase() === v;
    return false;
  }

  function parseInlineQuery(raw) {
    const inlineChips = [];
    const terms = [];
    String(raw || '').trim().split(/\s+/).filter(Boolean).forEach(tok => {
      const m = tok.match(/^(-?)([a-z_]+):(.+)$/i);
      if (m) inlineChips.push({ exclude: m[1] === '-', key: m[2].toLowerCase(), value: m[3] });
      else terms.push(tok.toLowerCase());
    });
    return { inlineChips, terms };
  }

  function filterExplorerEvents(opts = {}) {
    const { skipIndex = false, skipFacetKey = null, skipSlice = false } = opts;
    const { startMs, endMs } = getWindowBounds();
    const idxDef = EXP_INDEX_DEFS.find(d => d.id === state.expIndex) || EXP_INDEX_DEFS[0];
    const { inlineChips, terms } = parseInlineQuery(state.expQuery);
    const allChips = [...state.expChips, ...inlineChips];

    // Group include chips by key (OR within same key, AND across keys)
    const incByKey = {};
    const excludes = [];
    allChips.forEach(c => {
      if (c.exclude) excludes.push(c);
      else if (c.key !== skipFacetKey) {
        if (!incByKey[c.key]) incByKey[c.key] = [];
        incByKey[c.key].push(c.value);
      }
    });

    return EXPLORER_EVENTS.filter(ev => {
      if (ev.tsMs < startMs || ev.tsMs > endMs) return false;
      if (!skipSlice && state.expTimeSlice) {
        if (ev.tsMs < state.expTimeSlice.startMs || ev.tsMs > state.expTimeSlice.endMs) return false;
      }
      if (!skipIndex && !idxDef.match(ev)) return false;

      for (const [k, vals] of Object.entries(incByKey)) {
        if (!vals.some(val => matchFieldVal(ev, k, val))) return false;
      }
      for (const ex of excludes) {
        if (matchFieldVal(ev, ex.key, ex.value)) return false;
      }
      if (terms.length) {
        const hay = `${ev.subject} ${ev.run} ${ev.kind} ${ev.verdict} ${ev.model || ''} ${ev.machineDevice} ${ev.wall} ${ev.summary} ${ev.diffFile || ''} ${ev.notes} ${ev.attempt ? '#' + ev.attempt : ''}`.toLowerCase();
        if (!terms.every(t => hay.includes(t))) return false;
      }
      return true;
    });
  }

  function sortExplorerEvents(list) {
    const dir = state.expSortDir === 'asc' ? 1 : -1;
    return [...list].sort((a, b) => {
      if (state.expSortBy === 'delta') {
        const av = a.deltaPct ?? -9999, bv = b.deltaPct ?? -9999;
        return (av - bv) * dir || (b.seq - a.seq);
      }
      if (state.expSortBy === 'tokens') {
        const av = (a.tokensIn || 0) + (a.tokensOut || 0);
        const bv = (b.tokensIn || 0) + (b.tokensOut || 0);
        return (av - bv) * dir || (b.seq - a.seq);
      }
      if (state.expSortBy === 'duration') {
        const av = a.durationMs ?? -1, bv = b.durationMs ?? -1;
        return (av - bv) * dir || (b.seq - a.seq);
      }
      return (a.tsMs - b.tsMs) * dir || (a.seq - b.seq) * dir;
    });
  }

    else {

      state.expChips.push({ key: k, value: v, exclude });
    }
  }

        metric: `${e.after || ''}`,
        held_out: e.heldOut || 'Pass',
        model: e.modelShort || '—',
        duration_ms: e.durationMs || 0
      }));
    } else if (ql.includes('crash_infra') || ql.includes('breaker.tripped')) {
      viewKind = 'forensics';
      const errs = subset.filter(e => ['crash_infra', 'invalid', 'tripped', 'needs_owner'].includes(e.verdict) || e.kind === 'breaker.tripped' || e.kind === 'need.opened');
      cols = [
        { k: 'ts', label: 'Time', mono: true },
        { k: 'run', label: 'Run', mono: true },
        { k: 'kind', label: 'Kind', mono: true },
        { k: 'verdict', label: 'Verdict', badge: true },
        { k: 'machine', label: 'Machine', mono: true },
        { k: 'wall', label: 'Wall', mono: true },
        { k: 'code', label: 'Exit / Gate', mono: true },
        { k: 'duration_ms', label: 'Duration', num: true, fmt: (v) => fmtDur(v) }
      ];
      rows = errs.map(e => ({
        _eventId: e.id,
        ts: e.tsShort,
        run: e.run,
        kind: e.kind,
        verdict: e.verdict,
        _tone: e.sev,
        machine: e.machine,
        wall: e.wall,
        code: e.exitCode != null ? `exit ${e.exitCode}` : e.metricLabel,
        duration_ms: e.durationMs || 0
      }));
    } else if (ql.includes('total_tokens') || (kindM && kindM[1] === 'trial.model_call')) {
      viewKind = 'slow_tokens';
      const calls = subset.filter(e => e.kind === 'trial.model_call');
      const maxTok = Math.max(10000, ...calls.map(c => (c.tokensIn || 0) + (c.tokensOut || 0)));
      const maxDur = Math.max(5000, ...calls.map(c => c.durationMs || 0));
      cols = [
        { k: 'seq', label: 'Seq', mono: true, fmt: (v) => `#${v}` },
        { k: 'run', label: 'Run', mono: true },
        { k: 'attempt', label: 'Att', mono: true, fmt: (v) => v ? `#${v}` : '—' },
        { k: 'model', label: 'Model', mono: true },
        { k: 'total_tokens', label: 'Total Tokens', num: true, barMax: maxTok, barTone: 'var(--working)', fmt: (v) => fmtTok(v) },
        { k: 'cache_pct', label: 'Cache %', num: true, barMax: 100, barTone: 'var(--good)', fmt: (v) => `${v}%` },
        { k: 'ttft_ms', label: 'TTFT', num: true, fmt: (v) => `${v} ms` },
        { k: 'duration_ms', label: 'Duration', num: true, barMax: maxDur, barTone: 'var(--needs)', fmt: (v) => fmtDur(v) }
      ];
      rows = calls.map(e => ({
        _eventId: e.id,
        seq: e.seq,
        run: e.run,
        attempt: e.attempt,
        model: e.modelShort || '—',
        total_tokens: (e.tokensIn || 0) + (e.tokensOut || 0),
        cache_pct: e.cachePct || 0,
        ttft_ms: e.ttftMs || 0,
        duration_ms: e.durationMs || 0
      }));
    } else {
      cols = [
        { k: 'seq', label: 'Seq', mono: true, fmt: (v) => `#${v}` },
        { k: 'ts', label: 'Time', mono: true },
        { k: 'subject', label: 'Subject', mono: true },
        { k: 'run', label: 'Run', mono: true },
        { k: 'kind', label: 'Kind', mono: true },
        { k: 'verdict', label: 'Verdict', badge: true },
        { k: 'machine', label: 'Machine', mono: true },
        { k: 'summary', label: 'Summary' }
      ];
      rows = subset.map(e => ({
        _eventId: e.id,
        seq: e.seq,
        ts: e.tsShort,
        subject: e.subject,
        run: e.run,
        kind: e.kind,
        verdict: e.verdict,
        _tone: e.sev,
        machine: e.machine,
        summary: e.summary
      }));
    }

    // Apply interactive column sort if set, else default ordering
    const sortCol = state.expSqlSortCol && cols.some(c => c.k === state.expSqlSortCol)
      ? state.expSqlSortCol
      : (viewKind === 'champions' ? 'delta_pct' : viewKind === 'model_yield' ? 'yield_pct' : viewKind === 'slow_tokens' ? 'total_tokens' : 'seq');
    const dir = state.expSqlSortDir === 'asc' ? 1 : -1;
    rows.sort((a, b) => {
      const av = a[sortCol], bv = b[sortCol];
      if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * dir;
      return String(av ?? '').localeCompare(String(bv ?? '')) * dir;
    });
    const sliced = rows.slice(0, limit);
    const ms = Math.max(0.8, performance.now() - t0 + 2.4).toFixed(1);
    return { cols, rows: sliced, totalMatched: rows.length, sortCol, ms };
  }

  let liveTailTimer = null;
  let liveTailIdx = 0;
  let liveSeqNext = 18426;
  function pushSimulatedLiveEvent() {
    if (!state.expLiveTail || state.screen !== 'explorer') return;
    const tpl = EXPLORER_LIVE_POOL[liveTailIdx % EXPLORER_LIVE_POOL.length];
    liveTailIdx += 1;
    state.expLiveCount += 1;
    const seq = liveSeqNext++;
    const ev = mkEv(`ev-live-${seq}`, seq, -(state.expLiveCount * 0.045), (seq * 137) % 900, tpl);
    EXPLORER_EVENTS.unshift(ev);
    render();
  }
  function setLiveTail(on) {
    state.expLiveTail = on;
    clearInterval(liveTailTimer);
    liveTailTimer = null;
    if (on) {
      setTimeout(() => { if (state.expLiveTail && state.screen === 'explorer') pushSimulatedLiveEvent(); }, 1100);
      liveTailTimer = setInterval(pushSimulatedLiveEvent, 2500);
    }
  }

  /* ========================================================================
     SVG Sparkline & Interactive Step Chart Generators
     ======================================================================== */
  function renderSparkline(vals, colorVar = 'var(--good)', w = 88, h = 24) {
    const min = Math.min(...vals);
    const max = Math.max(...vals);
    const pts = vals.map((v, i) => {
      const x = (i / (vals.length - 1)) * (w - 4) + 2;
      const y = max === min ? h / 2 : h - 3 - ((v - min) / (max - min)) * (h - 6);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Trend sparkline" style="display:block;flex-shrink:0;">
      <polygon points="2,${h} ${pts} ${w - 2},${h}" fill="${colorVar}" fill-opacity="0.12"></polygon>
      <polyline points="${pts}" fill="none" stroke="${colorVar}" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"></polyline>
    </svg>`;
  }

  function renderRunStepChart(compact = false) {
    const W = 640, H = compact ? 148 : 196;
    const pad = { l: 54, r: 18, t: 14, b: 26 };
    const minY = 1200, maxY = 1660;
    const maxX = 44;
    const sx = (a) => pad.l + (a / maxX) * (W - pad.l - pad.r);
    const sy = (v) => H - pad.b - ((v - minY) / (maxY - minY)) * (H - pad.t - pad.b);

    const champs = [
      { id: 0, label: 'Start', v: 1252 },
      { id: 5, label: '#1', v: 1289 },
      { id: 12, label: '#2', v: 1326 },
      { id: 19, label: '#3', v: 1354 },
      { id: 24, label: '#4', v: 1381 },
      { id: 31, label: '#5', v: 1408 },
      { id: 39, label: '#6', v: 1482 }
    ];
    let path = `M${sx(champs[0].id).toFixed(1)},${sy(champs[0].v).toFixed(1)}`;
    for (let i = 1; i < champs.length; i++) {
      path += ` H${sx(champs[i].id).toFixed(1)} V${sy(champs[i].v).toFixed(1)}`;
    }
    const endX = sx(43).toFixed(1);
    const fullStep = `${path} H${endX}`;
    const areaPath = `${fullStep} V${sy(minY).toFixed(1)} H${sx(0).toFixed(1)} Z`;

    const yTicks = [1252, 1400, 1550, 1650];
    const rejectedPts = [
      { id: 8, v: 1264 }, { id: 15, v: 1301 }, { id: 22, v: 1340 },
      { id: 29, v: 1362 }, { id: 35, v: 1429 }
    ];
    const holdPt = { id: 42, v: 1621 };

    return `
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Prefill throughput step chart: baseline 1,252 tok/s to Champion #6 at 1,482 tok/s">
        ${yTicks.map(t => `
          <line x1="${pad.l}" x2="${W - pad.r}" y1="${sy(t).toFixed(1)}" y2="${sy(t).toFixed(1)}"
            stroke="${t === 1252 ? 'var(--input)' : 'var(--grid)'}"
            stroke-dasharray="${t === 1252 ? '4 4' : ''}" stroke-width="1"></line>
          <text x="${pad.l - 8}" y="${(sy(t) + 4).toFixed(1)}" text-anchor="end" fill="var(--quiet)" font-size="11" font-family="var(--font-mono)">${t === 1252 ? '1,252' : t.toLocaleString()}</text>
        `).join('')}
        <text x="${W - pad.r}" y="${(sy(1252) - 4).toFixed(1)}" text-anchor="end" fill="var(--quiet)" font-size="10.5">baseline</text>
        <path d="${areaPath}" fill="var(--good)" fill-opacity="0.09"></path>
        <path d="${fullStep}" fill="none" stroke="var(--good)" stroke-width="2" stroke-linejoin="round"></path>
        ${rejectedPts.map(p => `
          <circle cx="${sx(p.id).toFixed(1)}" cy="${sy(p.v).toFixed(1)}" r="3" fill="var(--idle-mark)" opacity="0.7" class="chart-node" data-pick-attempt="${p.id === 35 ? 35 : 31}">
            <title>Attempt #${p.id}: ${p.v} tok/s (not promoted)</title>
          </circle>
        `).join('')}
        ${champs.slice(1).map(c => {
          const isSel = state.selectedAttemptId === c.id;
          return `<circle cx="${sx(c.id).toFixed(1)}" cy="${sy(c.v).toFixed(1)}" r="${isSel ? 5.5 : 4}"
            fill="var(--background)" stroke="${isSel ? 'var(--flame)' : 'var(--good)'}" stroke-width="${isSel ? 2.5 : 2}"
            class="chart-node" data-pick-attempt="${c.id === 39 || c.id === 31 ? c.id : 39}">
            <title>Champion ${c.label} (Attempt #${c.id}): ${c.v} tok/s — click to inspect</title>
          </circle>`;
        }).join('')}
        <!-- Pending Auditor Hold #42 -->
        <circle cx="${sx(holdPt.id).toFixed(1)}" cy="${sy(holdPt.v).toFixed(1)}" r="${state.selectedAttemptId === 42 ? 6 : 4.5}"
          fill="var(--needs-tint)" stroke="var(--needs)" stroke-width="2" class="chart-node" data-pick-attempt="42">
          <title>Attempt #42 (Needs review): 1,621 tok/s (+9.4%) — click to inspect</title>
        </circle>
        <text x="${(sx(holdPt.id) - 8).toFixed(1)}" y="${(sy(holdPt.v) + 4).toFixed(1)}" text-anchor="end" fill="var(--needs)" font-size="11" font-weight="600">#42 hold (1,621)</text>
        <!-- X-axis labels -->
        ${[0, 10, 20, 30, 40].map(a => `
          <text x="${sx(a).toFixed(1)}" y="${H - 7}" text-anchor="middle" fill="var(--quiet)" font-size="11" font-family="var(--font-mono)">#${a}</text>
        `).join('')}

  /* ========================================================================
     SCREEN 4: New Campaign (1-Page Sticky Wizard + Live thermite.yaml + Dry Run)
     ======================================================================== */
  function buildYaml() {
    if (state.campMode === 'research') {
      return `name: ${state.campName || 'allocator-tail-latency'}
mode: research
topic: Keeping p99 latency low under high thread contention
questions:
  - Which thread-local caches avoid lock contention?
  - How do jemalloc, mimalloc, and snmalloc compare on tail latency?
seeds: [https://example.com/allocators-overview]
live: ${state.campLive}`;
    }
    if (state.campMode === 'goal') {
      return `name: ${state.campName || 'add-fp16-prefill'}
mode: goal
repo: ${state.campRepo}
build: ${state.campBuild}
goals:
  - { id: tests, run: ctest --output-on-failure }
  - { id: speed, run: "${state.campRun}", metric: ${state.campMetric}, op: ">=", value: 1500 }
device: ${state.campDevice}
git: { onChampion: ${state.campGitMode}${state.campGitMode !== 'none' ? `, branch: ${state.campBranch}` : ''} }
live: ${state.campLive}`;
    }
    return `name: ${state.campName || 'llama-prefill-cuda'}
mode: hill_climb
repo: ${state.campRepo}
build: ${state.campBuild}
run: ${state.campRun}
check: ${state.campCheck}
score: { metric: ${state.campMetric}, direction: ${state.campDirection} }
device: ${state.campDevice}
git: { onChampion: ${state.campGitMode}${state.campGitMode !== 'none' ? `, branch: ${state.campBranch}` : ''} }
live: ${state.campLive}`;
  }

  /* ========================================================================
     SCREEN 5: Compute (machine > device Pool — ZERO "rigs")
     ======================================================================== */
  function renderCompute() {
    const filtered = state.machines.filter(m => {
      const fOk = state.computeFilter === 'all' || m.tags.includes(state.computeFilter);
      const q = state.computeSearch.trim().toLowerCase();
      const qOk = !q || m.name.toLowerCase().includes(q) || m.os.toLowerCase().includes(q) || m.devices.some(d => d.name.toLowerCase().includes(q));
      return fOk && qOk;
    });

  function buildExplorerHistogram(events) {
    const BUCKETS = 24;
    const { startMs, endMs } = getWindowBounds();
    const span = Math.max(60000, endMs - startMs);
    const step = span / BUCKETS;
    const buckets = Array.from({ length: BUCKETS }, (_, i) => ({
      idx: i,
      startMs: startMs + i * step,
      endMs: startMs + (i + 1) * step,
      good: 0, working: 0, needs: 0, wrong: 0, idle: 0, total: 0
    }));
    events.forEach(ev => {
      const bi = Math.min(BUCKETS - 1, Math.max(0, Math.floor((ev.tsMs - startMs) / step)));
      const b = buckets[bi];
      b[ev.sev] = (b[ev.sev] || 0) + 1;
      b.total += 1;
    });

    const maxTotal = Math.max(3, ...buckets.map(b => b.total));
    const W = 720, H = 68, padL = 4, padR = 4, padT = 5, padB = 3;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const colW = plotW / BUCKETS;
    const barW = Math.max(10, colW - 5);
    const stackOrder = [
      ['idle', 'var(--idle-bar)'],
      ['working', 'var(--working)'],
      ['good', 'var(--good)'],
      ['needs', 'var(--needs)'],
      ['wrong', 'var(--wrong)']
    ];

    const yMid = Math.ceil(maxTotal / 2);
    const ticks = [0, yMid, maxTotal];
    const xLabelIdxs = [0, 6, 12, 18, 23];

    const barsSvg = buckets.map(b => {
      const x = padL + b.idx * colW + (colW - barW) / 2;
      const isSlice = state.expTimeSlice && state.expTimeSlice.idx === b.idx;
      const dim = state.expTimeSlice && !isSlice ? 0.34 : 1;
      let curY = padT + plotH;
      const segs = [];
      stackOrder.forEach(([k, fill]) => {
        const cnt = b[k];
        if (!cnt) return;
        const h = Math.max(3, (cnt / maxTotal) * plotH);
        curY -= h;
        segs.push(`<rect x="${x.toFixed(1)}" y="${curY.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="1.2" fill="${fill}" opacity="${dim}"></rect>`);
      });
      const sliceLabel = `${fmtClockHM(b.startMs)}–${fmtClockHM(b.endMs)}`;
      return `
        <g class="exp-bucket-hit" data-exp-bucket="${b.idx}" data-b-start="${Math.round(b.startMs)}" data-b-end="${Math.round(b.endMs)}" data-b-label="${sliceLabel}" data-b-good="${b.good}" data-b-working="${b.working}" data-b-needs="${b.needs}" data-b-wrong="${b.wrong}" data-b-idle="${b.idle}" data-b-total="${b.total}">
          <rect class="exp-bucket-bg" x="${(padL + b.idx * colW).toFixed(1)}" y="${padT}" width="${colW.toFixed(1)}" height="${plotH}" fill="${isSlice ? 'var(--flame-tint)' : 'transparent'}"></rect>
          ${isSlice ? `<rect x="${(padL + b.idx * colW + 0.5).toFixed(1)}" y="${padT}" width="${(colW - 1).toFixed(1)}" height="${plotH}" fill="none" stroke="var(--flame)" stroke-width="1.5" rx="2"></rect>` : ''}
          ${segs.join('')}
        </g>`;
    }).join('');

    return `
      <div class="exp-hist-wrap" id="expHistWrap">
        <div class="exp-hist-head">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <strong style="color:var(--foreground);font-size:12px;">Events over time (${buckets.length} buckets)</strong>
            <span>${state.expTimeSlice ? `Zoomed slice: ${state.expTimeSlice.label}` : 'Click any bar to slice time window'}</span>
          </div>
          <div class="exp-hist-legend">
            <span class="exp-leg-item"><span class="exp-leg-sq" style="background:var(--good);"></span>Promoted / Win</span>
            <span class="exp-leg-item"><span class="exp-leg-sq" style="background:var(--working);"></span>Calls / Jobs</span>
            <span class="exp-leg-item"><span class="exp-leg-sq" style="background:var(--needs);"></span>Needs / Rules</span>
            <span class="exp-leg-item"><span class="exp-leg-sq" style="background:var(--wrong);"></span>Crash / Breaker</span>
            <span class="exp-leg-item"><span class="exp-leg-sq" style="background:var(--idle-bar);"></span>Neutral / Regress</span>
          </div>
        </div>
        <div style="position:relative;display:flex;align-items:stretch;gap:4px;">
          <div class="mono tabular text-quiet" style="display:flex;flex-direction:column;justify-content:space-between;font-size:10px;width:20px;text-align:right;padding:2px 0;flex-shrink:0;">
            <span>${maxTotal}</span><span>${yMid}</span><span>0</span>
          </div>
          <svg class="exp-hist-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Stacked event timeline histogram across 24 buckets" style="flex:1;min-width:0;">
            ${ticks.map(t => {
              const y = padT + plotH - (t / maxTotal) * plotH;
              return `<line x1="0" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"></line>`;
            }).join('')}
            ${barsSvg}
          </svg>
        </div>
        <div class="exp-hist-axes">
          ${xLabelIdxs.map(i => `<span>${fmtClockHM(buckets[i].startMs)}</span>`).join('')}
        </div>
        <div class="exp-hist-tooltip" id="expHistTooltip" aria-hidden="true"></div>
      </div>`;
  }

  function buildRedactedJsonl(events) {
    return events.slice(0, 12).map(ev => JSON.stringify({
      schema: 'thermite.sft.v1',
      redacted: true,
      seq: ev.seq,
      ts: ev.tsIso,
      run: ev.run,
      repo: ev.repo,
      kind: ev.kind,
      verdict: ev.verdict,
      attempt: ev.attempt,
      model: ev.model,
      wall: ev.wall,
      delta_pct: ev.deltaPct,
      throughput: ev.throughput,
      tokens: ev.tokensIn != null ? { in: ev.tokensIn, out: ev.tokensOut, cache_pct: ev.cachePct } : undefined,
      summary: ev.summary,
      patch: ev.diff ? ev.diff.map(l => l.s).join('\n') : undefined
    })).join('\n');
  }

      <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;">
        <button type="button" class="btn" id="closeJsonlModal2">Close</button>
        <button type="button" class="btn btn-main" id="copyJsonlBtn">${ico('copy', 'icon icon-sm')} Copy JSONL</button>
      </div>`;
    document.getElementById('jsonlModal').classList.add('open');
    document.getElementById('closeJsonlModal').onclick = closeJsonlModal;
    document.getElementById('closeJsonlModal2').onclick = closeJsonlModal;
    document.getElementById('copyJsonlBtn').onclick = () => copyText(lines, `${filtered.length} JSONL lines`);
  }
  function closeJsonlModal() {
    document.getElementById('jsonlModal').classList.remove('open');
  }
  document.getElementById('jsonlModal').addEventListener('click', (e) => {
    if (e.target.id === 'jsonlModal') closeJsonlModal();
  });

  function renderExplorer() {
    // Base events without index tab (for dynamic index counts) and fully filtered
    const indexBase = filterExplorerEvents({ skipIndex: true });
    const histEvents = filterExplorerEvents({ skipSlice: true });
    const filtered = sortExplorerEvents(filterExplorerEvents());
    const windowOnly = (() => {
      const { startMs, endMs } = getWindowBounds();
      return EXPLORER_EVENTS.filter(e => e.tsMs >= startMs && e.tsMs <= endMs);
    })();

    // Ensure selection stays valid
    let selEv = filtered.find(e => e.id === state.expSelectedId) || filtered[0] || EXPLORER_EVENTS[0];
    if (selEv && selEv.id !== state.expSelectedId && filtered.length) state.expSelectedId = selEv.id;

    // Filtered 5-stat telemetry calculations
    const promotedCnt = filtered.filter(e => e.kind === 'attempt.promoted').length;
    const judgedCnt = filtered.filter(e => e.kind === 'attempt.promoted' || e.kind === 'attempt.judged').length;
    const winRate = judgedCnt ? Math.round((promotedCnt / judgedCnt) * 100) : 0;

    const durs = filtered.filter(e => e.durationMs != null && (e.kind === 'attempt.promoted' || e.kind === 'attempt.judged' || e.kind === 'job.finished')).map(e => e.durationMs).sort((a, b) => a - b);
    const p50 = durs.length ? durs[Math.floor((durs.length - 1) * 0.5)] : null;
    const p95 = durs.length ? durs[Math.floor((durs.length - 1) * 0.95)] : null;

    const calls = filtered.filter(e => e.kind === 'trial.model_call');
    const totalTokens = calls.reduce((s, e) => s + (e.tokensIn || 0) + (e.tokensOut || 0), 0);
    const avgCache = calls.length ? (calls.reduce((s, e) => s + (e.cachePct || 0), 0) / calls.length) : null;

    const infraCnt = filtered.filter(e => e.verdict === 'crash_infra').length;
    const invalidCnt = filtered.filter(e => e.verdict === 'invalid').length;
    const failRate = judgedCnt ? (((infraCnt + invalidCnt) / judgedCnt) * 100).toFixed(1) : '0.0';

    const activeFilterCount = state.expChips.length + (state.expTimeSlice ? 1 : 0) + (state.expQuery.trim() ? 1 : 0);

    // Facet sidebar HTML (Datadog style dynamic counts & micro-bars)
    const facetsHtml = EXP_FACET_DEFS.map(fg => {
      const pool = filterExplorerEvents({ skipFacetKey: fg.key });
      const counts = {};
      pool.forEach(e => {
        const val = fg.get(e);
        if (val) counts[val] = (counts[val] || 0) + 1;
      });
      // Ensure any active chip value stays visible even if 0
      state.expChips.filter(c => c.key === fg.key).forEach(c => {
        if (counts[c.value] == null) counts[c.value] = 0;
      });
      const entries = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      const maxC = Math.max(1, ...entries.map(x => x[1]));
      const collapsed = !!state.expFacetCollapsed[fg.key];
      return `
        <div class="exp-facet-group">
          <button type="button" class="exp-facet-toggle" data-exp-facet-grp="${fg.key}" aria-expanded="${!collapsed}">
            <span>${fg.label}</span>
            ${ico(collapsed ? 'chevronRight' : 'chevronDown', 'icon icon-sm')}
          </button>
          ${collapsed ? '' : entries.map(([val, cnt]) => {
            const checked = state.expChips.some(c => c.key === fg.key && c.value === val && !c.exclude);
            const pct = Math.round((cnt / maxC) * 100);
            return `
              <label class="exp-facet-opt">
                <span class="exp-facet-opt-row">
                  <input type="checkbox" data-exp-facet-key="${fg.key}" data-exp-facet-val="${escHtml(val)}" ${checked ? 'checked' : ''} />
                  <span class="exp-facet-val mono" title="${escHtml(val)}">${escHtml(val)}</span>
                  <span class="exp-facet-cnt">${cnt}</span>
                </span>
                <span class="exp-facet-bar"><span class="exp-facet-bar-fill" style="width:${pct}%;"></span></span>
              </label>`;
          }).join('')}
        </div>`;
    }).join('');

    // SQL Mode execution when active
    const sqlRes = state.expMode === 'sql' ? executeExplorerSql(state.expSqlText, windowOnly) : null;

    const mainHtml = `
      <div class="exp-shell">
        <!-- Top Controls & Record Index Tabs -->
        <div class="exp-topbar">
          <div class="exp-top-row">
            <div class="exp-title-group">
              <strong style="font-size:16px;letter-spacing:-0.015em;">Explorer</strong>
              <span class="wall-badge">sql-explorer · PG 18 + NATS</span>
              ${state.expLiveTail ? `<span class="chip chip-good"><span class="dot dot-good"></span>Tailing${state.expLiveCount ? ` (+${state.expLiveCount})` : ''}</span>` : ''}
            </div>

            <div class="exp-controls-cluster">
              <div class="seg" role="group" aria-label="Query mode">
                <button type="button" data-exp-mode="visual" aria-pressed="${state.expMode === 'visual'}">Visual Filter</button>
                <button type="button" data-exp-mode="sql" aria-pressed="${state.expMode === 'sql'}">SQL</button>
              </div>

              <div class="seg" role="group" aria-label="Time window">
                ${[
                  ['1h', 'Last 1h'],
                  ['6h', 'Last 6h'],
                  ['24h', 'Last 24h'],
                  ['all', 'Full Run']
                ].map(([id, lbl]) => `
                  <button type="button" data-exp-win="${id}" aria-pressed="${state.expWindow === id}">${lbl}</button>
                `).join('')}
              </div>

              <button type="button" class="switch-btn" id="expLiveTailBtn" role="switch" aria-checked="${state.expLiveTail}" title="Stream live simulated NATS events every 2.5s">
                <span class="switch-track"><span class="switch-thumb"></span></span>
                <span>Live Tail</span>
              </button>

              <button type="button" class="btn btn-sm" id="expExportJsonlBtn">
                ${ico('download', 'icon icon-sm')}
                <span>Export JSONL</span>
              </button>
            </div>
          </div>

          <div class="exp-index-tabs" role="tablist" aria-label="Record index tabs">
            ${EXP_INDEX_DEFS.map(tab => {
              const cnt = indexBase.filter(tab.match).length;
              return `
                <button type="button" class="exp-idx-btn" role="tab" data-exp-index="${tab.id}" aria-selected="${state.expIndex === tab.id}">
                  <span>${tab.label}</span>
                  <span class="exp-idx-cnt">${cnt}</span>
                </button>`;
            }).join('')}
          </div>
        </div>

        <!-- Visual Filter Query Bar (shown in Visual mode) -->
        ${state.expMode === 'visual' ? `
          <div class="exp-query-band">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <div class="exp-search-box" style="flex:1 1 260px;">
                <span style="color:var(--quiet);display:inline-flex;align-items:center;padding-left:2px;">${ico('search', 'icon icon-sm')}</span>
                ${state.expTimeSlice ? `
                  <span class="exp-chip slice">
                    <span class="exp-chip-toggle">time:${escHtml(state.expTimeSlice.label)}</span>
                    <button type="button" class="exp-chip-x" id="expClearSlice" aria-label="Clear time slice">×</button>
                  </span>` : ''}
                ${state.expChips.map((c, idx) => `
                  <span class="exp-chip ${c.exclude ? 'exclude' : ''}">
                    <button type="button" class="exp-chip-toggle" data-exp-flip-chip="${idx}" title="Click to toggle include/exclude">${c.exclude ? '-' : ''}${escHtml(c.key)}:${escHtml(c.value)}</button>
                    <button type="button" class="exp-chip-x" data-exp-rm-chip="${idx}" aria-label="Remove ${escHtml(c.key)} filter">×</button>
                  </span>`).join('')}
                <input id="expSearchInput" class="exp-search-input mono" placeholder="Search text or add key:value (e.g. run:llama-prefill-cuda verdict:promoted -verdict:neutral)..." value="${escHtml(state.expQuery)}" />
              </div>
              ${activeFilterCount > 0 ? `<button type="button" class="btn btn-xs" id="expClearAllBtn">Clear all</button>` : ''}
            </div>
            <div class="exp-quick-hints">
              <span>Quick filters:</span>
              ${[
                ['run', 'llama-prefill-cuda', false],
                ['verdict', 'promoted', false],
                ['model', 'opus-5-5', false],
                ['verdict', 'neutral', true],
                ['verdict', 'crash_infra', false]
              ].map(([k, v, ex]) => `
                <button type="button" class="exp-hint-pill" data-exp-quick-k="${k}" data-exp-quick-v="${v}" data-exp-quick-ex="${ex ? '1' : ''}">${ex ? '-' : ''}${k}:${v}</button>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- Filtered 5-Stat Telemetry Ribbon + Stacked Timeline Histogram -->
        <div class="exp-viz-band">
          <div class="exp-kpi-ribbon" aria-label="Filtered telemetry summary">
            <div class="exp-kpi">
              <div class="exp-kpi-lbl">Matched Events</div>
              <div class="exp-kpi-val">${filtered.length} <span class="text-quiet" style="font-size:12px;font-weight:500;">/ ${EXPLORER_EVENTS.length}</span></div>
              <div class="exp-kpi-sub">Window: ${state.expWindow === 'all' ? 'Full Run' : `Last ${state.expWindow}`}</div>
            </div>
            <div class="exp-kpi">
              <div class="exp-kpi-lbl">Promoted Champions</div>
              <div class="exp-kpi-val text-good">${promotedCnt}</div>
              <div class="exp-kpi-sub">${winRate}% of ${judgedCnt} judged</div>
            </div>
            <div class="exp-kpi">
              <div class="exp-kpi-lbl">Trial Duration (p50 / p95)</div>
              <div class="exp-kpi-val">${p50 != null ? `${fmtDur(p50)} / ${fmtDur(p95)}` : '—'}</div>
              <div class="exp-kpi-sub">${durs.length} measured runs</div>
            </div>
            <div class="exp-kpi">
              <div class="exp-kpi-lbl">Tokens &amp; Avg Cache</div>
              <div class="exp-kpi-val">${totalTokens ? fmtTok(totalTokens) : '—'} <span class="text-working" style="font-size:12.5px;">${avgCache != null ? `· ${avgCache.toFixed(1)}%` : ''}</span></div>
              <div class="exp-kpi-sub">${calls.length} libfx model calls</div>
            </div>
            <div class="exp-kpi">
              <div class="exp-kpi-lbl">Crash / Invalid Rate</div>
              <div class="exp-kpi-val ${infraCnt + invalidCnt > 0 ? 'text-wrong' : 'text-good'}">${failRate}%</div>
              <div class="exp-kpi-sub">${infraCnt} infra · ${invalidCnt} invalid</div>
            </div>
          </div>

          ${buildExplorerHistogram(histEvents)}
        </div>

        <!-- 3-Pane Resizable Observability Workbench -->
        <div class="exp-workbench" id="expWorkbench">
          <!-- Left Datadog-Style Facet Sidebar -->
          <aside class="exp-facet-rail ${!state.expFacetsOpen ? 'collapsed' : ''} ${state.expMobileFacetsOpen ? 'mobile-open' : ''}" aria-label="Facet filters">
            <div class="exp-facet-head">
              <span>Facets</span>
              <div style="display:flex;align-items:center;gap:4px;">
                ${state.expChips.length ? `<button type="button" class="btn btn-ghost btn-xs" id="expFacetReset">Reset</button>` : ''}
                <button type="button" class="btn btn-ghost btn-xs" id="expCloseFacets" aria-label="Hide facets">${ico('x', 'icon icon-sm')}</button>
              </div>
            </div>
            <div class="exp-facet-scroll">${facetsHtml}</div>
          </aside>
          <div class="exp-facet-scrim ${state.expMobileFacetsOpen ? 'open' : ''}" id="expFacetScrim"></div>

          <!-- Center Pane: Either High-Density Event Stream OR Live Read-Only SQL Workbench -->
          <section class="exp-stream-pane" aria-label="${state.expMode === 'sql' ? 'SQL query workbench' : 'Event stream'}">
            ${state.expMode === 'visual' ? `
              <div class="exp-stream-toolbar">
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                  <button type="button" class="btn btn-xs" id="expToggleFacetsBtn" aria-expanded="${state.expFacetsOpen || state.expMobileFacetsOpen}">
                    ${ico('filter', 'icon icon-sm')}
                    <span>Facets${state.expChips.length ? ` (${state.expChips.length})` : ''}</span>
                  </button>
                  <span class="tabular text-quiet">${filtered.length} event${filtered.length === 1 ? '' : 's'} · ↑/↓ navigate</span>
                </div>
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                  <div class="seg" role="group" aria-label="Sort events">
                    ${[
                      ['time', 'Time'],
                      ['delta', 'Delta'],
                      ['tokens', 'Tokens'],
                      ['duration', 'Duration']
                    ].map(([k, lbl]) => `
                      <button type="button" data-exp-sort="${k}" aria-pressed="${state.expSortBy === k}">${lbl}${state.expSortBy === k ? (state.expSortDir === 'desc' ? ' ↓' : ' ↑') : ''}</button>
                    `).join('')}
                  </div>
                  <div class="seg" role="group" aria-label="Row density">
                    <button type="button" data-exp-density="compact" aria-pressed="${state.expDensity === 'compact'}">Compact</button>
                    <button type="button" data-exp-density="detailed" aria-pressed="${state.expDensity === 'detailed'}">Detailed</button>
                  </div>
                  <button type="button" class="btn btn-xs mobile-inspector-btn" id="openExpMobileInsp">${ico('panelRight', 'icon icon-sm')} Inspect</button>
                </div>
              </div>

              <div class="exp-stream-scroll" id="expStreamScroll">
                ${filtered.length === 0 ? `
                  <div style="padding:28px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;">
                    <strong style="font-size:14.5px;">No events match the active filters</strong>
                    <div class="text-soft" style="font-size:13px;">Clear one or more facet chips, widen the time window, or reset the histogram slice to inspect all ${EXPLORER_EVENTS.length} recorded NATS events.</div>
                    <button type="button" class="btn btn-main btn-sm" id="expEmptyResetBtn">Clear all filters</button>
                  </div>
                ` : filtered.map(ev => {
                  const sel = selEv && selEv.id === ev.id;
                  const kindBg = ev.sev === 'idle' ? 'var(--idle-tint)' : `var(--${ev.sev}-tint)`;
                  const kindInk = ev.sev === 'idle' ? 'var(--soft)' : `var(--${ev.sev})`;
                  const metricInk = ev.metricTone === 'idle' ? 'var(--soft)' : `var(--${ev.metricTone})`;
                  return `
                    <div class="exp-row ${sel ? 'selected' : ''}" data-exp-row="${ev.id}" tabindex="0" role="button" aria-selected="${sel}">
                      <div class="exp-sev-bar exp-sev-${ev.sev}"></div>
                      <div class="exp-row-inner">
                        <div class="exp-row-top">
                          <span class="exp-ts">${ev.tsShort}</span>
                          <span class="exp-kind-badge" style="background:${kindBg};color:${kindInk};">${escHtml(ev.kind)}</span>
                          <span class="exp-run-tag">${escHtml(ev.run)}${ev.attempt != null ? ` #${ev.attempt}` : ''}</span>
                          ${ev.metricLabel ? `<span class="exp-metric-pill" style="color:${metricInk};">${escHtml(ev.metricLabel)}</span>` : ''}
                        </div>
                        <div class="exp-row-main">
                          <span class="exp-summary" title="${escHtml(ev.summary)}">${escHtml(ev.summary)}</span>
                          <span class="exp-meta-tags exp-hide-sm">
                            <span>${escHtml(ev.machine)}</span>
                            ${ev.modelShort ? `<span>· ${escHtml(ev.modelShort)}</span>` : ''}
                          </span>
                        </div>
                        ${state.expDensity === 'detailed' ? `
                          <div class="exp-row-detail">
                            <span>${escHtml(ev.subject)}</span>
                            <span>seq #${ev.seq}</span>
                            <span>${escHtml(ev.wall)}</span>
                            <span>${escHtml(ev.machineDevice)}</span>
                            ${ev.durationMs != null ? `<span>dur ${fmtDur(ev.durationMs)}</span>` : ''}
                          </div>` : ''}
                      </div>
                    </div>`;
                }).join('')}
              </div>
            ` : `
              <!-- Read-Only PostgreSQL SQL Workbench -->
              <div class="exp-stream-toolbar">
                <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                  <button type="button" class="btn btn-xs" id="expToggleFacetsBtn">${ico('filter', 'icon icon-sm')} Facets</button>
                  <span class="chip chip-idle" style="height:22px;font-size:11px;">RO · PG 18 · 5s timeout</span>
                  <span class="tabular text-quiet">${sqlRes.rows.length} rows in ${sqlRes.ms} ms</span>
                </div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <button type="button" class="btn btn-xs mobile-inspector-btn" id="openExpMobileInsp">${ico('panelRight', 'icon icon-sm')} Inspect</button>
                  <button type="button" class="btn btn-main btn-xs" id="expRunSqlBtn">${ico('play', 'icon icon-sm')} Run SQL</button>
                </div>
              </div>

              <div class="exp-sql-panel">
                <div>
                  <div style="font-size:11.5px;font-weight:600;color:var(--quiet);margin-bottom:5px;">Saved Views (click to load &amp; execute live)</div>
                  <div class="exp-saved-views">
                    ${SQL_SAVED_VIEWS.map(sv => `
                      <button type="button" class="pill-btn" data-exp-sql-preset="${sv.id}" aria-pressed="${state.expSqlPreset === sv.id}" title="${escHtml(sv.desc)}">${escHtml(sv.label)}</button>
                    `).join('')}
                  </div>
                </div>

                <div>
                  <textarea id="expSqlEditor" class="exp-sql-editor" spellcheck="false" aria-label="Read-only PostgreSQL query editor">${escHtml(state.expSqlText)}</textarea>
                  <div class="field-hint">Read-only role (<span class="mono">thermite_ro</span>). Supports <span class="mono">WHERE run|kind|verdict|machine|wall = '...'</span> and <span class="mono">LIMIT N</span>. Press <span class="mono">Ctrl+Enter</span> to run.</div>
                </div>

                <div class="exp-sql-table-wrap">
                  <div class="exp-sql-scroll">
                    <table class="data-table">
                      <thead>
                        <tr>
                          ${sqlRes.cols.map(c => `
                            <th style="${c.num ? 'text-align:right;' : ''}cursor:pointer;" data-exp-sql-sort="${c.k}">
                              ${escHtml(c.label)}${sqlRes.sortCol === c.k ? (state.expSqlSortDir === 'desc' ? ' ↓' : ' ↑') : ''}
                            </th>`).join('')}
                        </tr>
                      </thead>
                      <tbody>
                        ${sqlRes.rows.length === 0 ? `
                          <tr><td colspan="${sqlRes.cols.length}" class="text-quiet" style="padding:16px;">Query returned 0 rows for the active time window.</td></tr>
                        ` : sqlRes.rows.map(row => `
                          <tr class="${selEv && row._eventId === selEv.id ? 'selected' : ''}" data-exp-sql-row="${row._eventId || ''}">
                            ${sqlRes.cols.map(c => {
                              const raw = row[c.k];
                              const txt = c.fmt ? c.fmt(raw) : String(raw ?? '—');
                              if (c.barMax) {
                                const pct = Math.min(100, Math.max(2, Math.round((Number(raw || 0) / c.barMax) * 100)));
                                return `<td class="tabular">
                                  <div class="exp-bar-cell">
                                    <div class="exp-inline-bar"><div class="exp-inline-bar-fill" style="width:${pct}%;background:${c.barTone || 'var(--flame)'};"></div></div>
                                    <span style="font-weight:600;">${escHtml(txt)}</span>
                                  </div>
                                </td>`;
                              }
                              if (c.badge) {
                                return `<td><span class="chip chip-${row._tone || 'idle'}" style="height:20px;font-size:11px;">${escHtml(txt)}</span></td>`;
                              }
                              return `<td class="${c.mono ? 'mono' : ''} ${c.num ? 'tabular' : ''} ${c.k === 'summary' ? 'truncate' : ''}" style="${c.num ? 'text-align:right;' : ''}${c.k === 'summary' ? 'max-width:260px;' : ''}">${escHtml(txt)}</td>`;
                            }).join('')}
                          </tr>`).join('')}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            `}
          </section>

          <!-- Draggable ResizeGutter (Exact Magnesium Pattern) -->
          <div class="resize-gutter" id="expGutter" tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize explorer inspector" aria-valuenow="${state.expInspWidth}" title="Drag to resize · double-click to reset · ←/→ arrows"></div>

          <!-- Right Resizable BesidePanel Inspector -->
          <aside class="beside-pane ${state.expMobileInspOpen ? 'mobile-open' : ''}" id="expBeside" style="width:${state.expInspWidth}px;" aria-label="Event inspector">
            ${renderExplorerInspector(selEv)}
          </aside>
        </div>
      </div>`;

    return wrapShell('explorer', 'Explorer', mainHtml);
  }

  /* ========================================================================
     Master Render & Event Binding
     ======================================================================== */
  function render() {
    const root = document.getElementById('appRoot');
    document.querySelectorAll('.review-tab').forEach(b => {
      b.setAttribute('aria-selected', String(b.dataset.screen === state.screen));
    });

    if (state.screen === 'onboarding') root.innerHTML = renderOnboarding();
    else if (state.screen === 'home') root.innerHTML = renderHome();
    else if (state.screen === 'run') root.innerHTML = renderRunWorkspace();
    else if (state.screen === 'new-campaign') root.innerHTML = renderNewCampaign();
    else if (state.screen === 'compute') root.innerHTML = renderCompute();
    else if (state.screen === 'explorer') root.innerHTML = renderExplorer();
    else root.innerHTML = renderKnowledgeSetup();

    bindEvents();
  }

  function bindEvents() {
    // Sidebar navigation & mobile drawer
    document.querySelectorAll('[data-go-screen]').forEach(el => {
      el.onclick = () => { state.screen = el.dataset.goScreen; state.drawerOpen = false; render(); };
    });
    document.querySelectorAll('[data-go-ks]').forEach(el => {
      el.onclick = () => { state.screen = 'knowledge-setup'; state.ksView = el.dataset.goKs; state.drawerOpen = false; render(); };
    });
    const openSb = document.getElementById('openSidebarBtn');
    if (openSb) openSb.onclick = () => { state.drawerOpen = !state.drawerOpen; render(); };
    const sbScrim = document.getElementById('sidebarScrim');
    if (sbScrim) sbScrim.onclick = () => { state.drawerOpen = false; render(); };

    // Screen 1: Onboarding
    document.querySelectorAll('[data-ob-step]').forEach(b => {
      b.onclick = () => { state.onboardStep = Number(b.dataset.obStep); render(); };
    });
    const ob1 = document.getElementById('obStep1Next');
    if (ob1) ob1.onclick = () => {
      state.accountUser = document.getElementById('obUser')?.value || 'owner';
      state.onboardStep = 2;
      showToast('Owner account created (session cookie set)');
      render();
    };
    const obSkip2 = document.getElementById('obSkip2');
    if (obSkip2) obSkip2.onclick = () => { state.onboardStep = 3; render(); };
    const obSearch = document.getElementById('obProvSearch');
    if (obSearch) obSearch.oninput = (e) => {
      state.providerSearch = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const el = document.getElementById('obProvSearch');
