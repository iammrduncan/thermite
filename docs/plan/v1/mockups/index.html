    if (facetScrim) facetScrim.onclick = () => { state.expMobileFacetsOpen = false; render(); };
    const facetReset = document.getElementById('expFacetReset');
    if (facetReset) facetReset.onclick = () => { state.expChips = []; render(); };
    document.querySelectorAll('[data-exp-facet-grp]').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.expFacetGrp;
        state.expFacetCollapsed[k] = !state.expFacetCollapsed[k];
        render();
      };
    });
    document.querySelectorAll('[data-exp-facet-key]').forEach(cb => {
      cb.onchange = () => {
        addExplorerChip(cb.dataset.expFacetKey, cb.dataset.expFacetVal, false);
        render();
      };
    });

    // Stream toolbar & row selection
    document.querySelectorAll('[data-exp-sort]').forEach(b => {
      b.onclick = () => {
        const k = b.dataset.expSort;
        if (state.expSortBy === k) state.expSortDir = state.expSortDir === 'desc' ? 'asc' : 'desc';
        else { state.expSortBy = k; state.expSortDir = 'desc'; }
        render();
      };
    });
    document.querySelectorAll('[data-exp-density]').forEach(b => {
      b.onclick = () => { state.expDensity = b.dataset.expDensity; render(); };
    });
    document.querySelectorAll('[data-exp-row]').forEach(row => {
      row.onclick = () => {
        state.expSelectedId = row.dataset.expRow;
        if (isNarrow()) state.expMobileInspOpen = true;
        render();
      };
    });

    // SQL mode controls
    document.querySelectorAll('[data-exp-sql-preset]').forEach(b => {
      b.onclick = () => {
        const sv = SQL_SAVED_VIEWS.find(x => x.id === b.dataset.expSqlPreset);
        if (!sv) return;
        state.expSqlPreset = sv.id;
        state.expSqlText = sv.sql;
        state.expSqlSortCol = null;
        state.expSqlSortDir = 'desc';
        render();
      };
    });
    const sqlEd = document.getElementById('expSqlEditor');
    if (sqlEd) {
      sqlEd.oninput = (e) => { state.expSqlText = e.target.value; };
      sqlEd.onkeydown = (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          e.preventDefault();
          render();
          showToast('Executed read-only SQL query');
        }
      };
    }
    const runSqlBtn = document.getElementById('expRunSqlBtn');
    if (runSqlBtn) runSqlBtn.onclick = () => { render(); showToast('Executed read-only SQL query'); };
    document.querySelectorAll('[data-exp-sql-sort]').forEach(th => {
      th.onclick = () => {
        const k = th.dataset.expSqlSort;
        if (state.expSqlSortCol === k) state.expSqlSortDir = state.expSqlSortDir === 'desc' ? 'asc' : 'desc';
        else { state.expSqlSortCol = k; state.expSqlSortDir = 'desc'; }
        render();
      };
    });
    document.querySelectorAll('[data-exp-sql-row]').forEach(tr => {
      tr.onclick = () => {
        const id = tr.dataset.expSqlRow;
        if (!id) return;
        state.expSelectedId = id;
        if (isNarrow()) state.expMobileInspOpen = true;
        render();
      };
    });

    // Inspector tabs, quick actions, field +/- filters, Context jump, and ResizeGutter
    document.querySelectorAll('[data-exp-insp-tab]').forEach(b => {
      b.onclick = () => { state.expInspTab = b.dataset.expInspTab; render(); };
    });
    document.querySelectorAll('[data-exp-field-inc]').forEach(b => {
      b.onclick = () => {
        addExplorerChip(b.dataset.expFieldInc, b.dataset.expFieldVal, false);
        state.expMode = 'visual';
        render();
      };
    });
    document.querySelectorAll('[data-exp-field-exc]').forEach(b => {
      b.onclick = () => {
        addExplorerChip(b.dataset.expFieldExc, b.dataset.expFieldVal, true);
        state.expMode = 'visual';
        render();
      };
    });
    document.querySelectorAll('[data-exp-pick-ctx]').forEach(row => {
      row.onclick = () => { state.expSelectedId = row.dataset.expPickCtx; render(); };
    });
    const copyJson = document.getElementById('expCopyJsonBtn');
    if (copyJson) copyJson.onclick = () => {
      const txt = document.getElementById('expRawJsonPre')?.textContent || '';
      copyText(txt, 'NATS envelope JSON');
    };
    const qfAtt = document.getElementById('expQuickFilterAtt');
    if (qfAtt) qfAtt.onclick = () => {
      const ev = EXPLORER_EVENTS.find(e => e.id === state.expSelectedId);
      if (ev && ev.attempt != null) { addExplorerChip('attempt', String(ev.attempt), false); state.expMode = 'visual'; render(); }
    };
    const qfRun = document.getElementById('expQuickFilterRun');
    if (qfRun) qfRun.onclick = () => {
      const ev = EXPLORER_EVENTS.find(e => e.id === state.expSelectedId);
      if (ev) { addExplorerChip('run', ev.run, false); state.expMode = 'visual'; render(); }
    };
    const qOpenRun = document.getElementById('expQuickOpenRun');
    if (qOpenRun) qOpenRun.onclick = () => { state.screen = 'run'; render(); };
    const qRejudge = document.getElementById('expQuickRejudge');
    if (qRejudge) qRejudge.onclick = () => {
      const ev = EXPLORER_EVENTS.find(e => e.id === state.expSelectedId);
      showToast(`Queued first-class rejudge for ${ev?.run || 'run'} #${ev?.attempt ?? ''}`);
    };
    const openExpMob = document.getElementById('openExpMobileInsp');
    if (openExpMob) openExpMob.onclick = () => { state.expMobileInspOpen = true; render(); };
    const closeExpMob = document.getElementById('closeExpMobileInsp');
    if (closeExpMob) closeExpMob.onclick = () => { state.expMobileInspOpen = false; render(); };

    const expGutter = document.getElementById('expGutter');
    const expBeside = document.getElementById('expBeside');
    const expWb = document.getElementById('expWorkbench');
    if (expGutter && expBeside && expWb) {
      expGutter.ondblclick = () => { state.expInspWidth = 396; expBeside.style.width = '396px'; showToast('Inspector width reset'); };
      expGutter.onkeydown = (e) => {
        if (e.key === 'ArrowLeft') { state.expInspWidth = Math.min(620, state.expInspWidth + 24); expBeside.style.width = `${state.expInspWidth}px`; }
        else if (e.key === 'ArrowRight') { state.expInspWidth = Math.max(290, state.expInspWidth - 24); expBeside.style.width = `${state.expInspWidth}px`; }
      };
      expGutter.onpointerdown = (ev) => {
        if (ev.button !== 0) return;
        ev.preventDefault();
        expGutter.setPointerCapture(ev.pointerId);
        expGutter.classList.add('dragging');
        const startX = ev.clientX;
        const startW = expBeside.getBoundingClientRect().width;
        const maxW = Math.max(340, expWb.getBoundingClientRect().width - 360);
        const onMove = (e) => {
          const next = Math.min(maxW, Math.max(290, Math.round(startW - (e.clientX - startX))));
          state.expInspWidth = next;
          expBeside.style.width = `${next}px`;
        };
        const onUp = () => {
          expGutter.classList.remove('dragging');
          expGutter.removeEventListener('pointermove', onMove);
          expGutter.removeEventListener('pointerup', onUp);
        };
        expGutter.addEventListener('pointermove', onMove);
        expGutter.addEventListener('pointerup', onUp);
      };
    }
  }

  function openAttemptDrawer(id) {
    const a = ATTEMPTS.find(x => x.id === id) || ATTEMPTS[0];
    openDrawer(`Attempt #${a.id} · ${a.outcomeLabel}`, `
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <span class="chip chip-${a.tone}">${a.outcomeLabel}</span>
        <span class="mono text-quiet" style="font-size:12px;">${a.lane} · ${a.duration}</span>
        <span class="tabular" style="font-weight:600;margin-left:auto;color:${a.deltaNum > 0 ? 'var(--good)' : (a.deltaNum < 0 ? 'var(--wrong)' : 'var(--soft)')};">${a.delta}</span>
      </div>
      <strong style="font-size:15px;">${a.title}</strong>
      <div style="padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--sidebar);font-size:12.5px;color:var(--soft);">
        <strong style="color:var(--foreground);">Judge verdict:</strong> ${a.judge}
      </div>
      <div class="diff-box">
        <div class="diff-header"><span>${a.file}</span><span>Unified diff</span></div>
        ${a.diff.map(l => `
          <div class="diff-line ${l.t === 'add' ? 'diff-add' : (l.t === 'del' ? 'diff-del' : '')}">
            <span class="diff-ln">${l.ln}</span><span>${l.s.replace(/</g, '&lt;')}</span>
          </div>
        `).join('')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button type="button" class="btn btn-sm" id="drRejudge">Rejudge</button>
        ${a.outcome !== 'champion' ? `<button type="button" class="btn btn-main btn-sm" id="drPromote">Promote champion</button>` : ''}
      </div>
    `);
    document.getElementById('drRejudge').onclick = () => { closeDrawer(); showToast(`Queued rejudge for Attempt #${a.id}`); };
    const drP = document.getElementById('drPromote');
    if (drP) drP.onclick = () => { closeDrawer(); document.querySelector(`[data-promote-att="${a.id}"]`)?.click(); };
  }

  /* ========================================================================
     Review Bar Controls + Keyboard Shortcuts
     ======================================================================== */
  document.querySelectorAll('.review-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.screen = btn.dataset.screen;
      state.drawerOpen = false;
      closeDrawer();
      closeJsonlModal();
      render();
    });
  });

  document.querySelectorAll('[data-vp]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.viewport = btn.dataset.vp;
      const frame = document.getElementById('deviceFrame');
      frame.className = `device-frame viewport-${state.viewport}`;
      document.querySelectorAll('[data-vp]').forEach(x => x.setAttribute('aria-pressed', String(x === btn)));
      state.drawerOpen = false;
      state.mobileInspectorOpen = false;
      state.expMobileFacetsOpen = false;
      state.expMobileInspOpen = false;
      render();
    });
  });

  function setTheme(next) {
    state.theme = next;
    document.documentElement.setAttribute('data-theme', next);
    document.getElementById('themeLabel').textContent = next === 'dark' ? 'Light' : 'Dark';
    document.getElementById('themeIcon').innerHTML = next === 'dark'
      ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>'
      : '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>';
  }
  document.getElementById('themeToggle').addEventListener('click', () => setTheme(state.theme === 'light' ? 'dark' : 'light'));

  document.addEventListener('click', () => {
    if (state.gitPopoverOpen) { state.gitPopoverOpen = false; render(); }
  });

  document.addEventListener('keydown', (e) => {
    const tag = document.activeElement?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'Escape') {
      closeDrawer();
      closeAddMachineModal();
      closeJsonlModal();
      state.gitPopoverOpen = false;
      state.drawerOpen = false;
      state.expMobileFacetsOpen = false;
      state.expMobileInspOpen = false;
      render();
      return;
    }
    const map = { '1': 'onboarding', '2': 'home', '3': 'run', '4': 'new-campaign', '5': 'compute', '6': 'knowledge-setup', '7': 'explorer' };
    if (map[e.key]) { state.screen = map[e.key]; render(); }
    else if (e.key.toLowerCase() === 't') setTheme(state.theme === 'light' ? 'dark' : 'light');
    else if (state.screen === 'run' && (e.key.toLowerCase() === 'a' || e.key.toLowerCase() === 'b')) {
      state.runDir = e.key.toUpperCase();
      render();
    } else if (state.screen === 'explorer' && state.expMode === 'visual' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      const rows = sortExplorerEvents(filterExplorerEvents());
      if (!rows.length) return;
      const idx = rows.findIndex(r => r.id === state.expSelectedId);
      const nextIdx = e.key === 'ArrowDown' ? Math.min(rows.length - 1, idx + 1) : Math.max(0, idx - 1);
      state.expSelectedId = rows[nextIdx].id;
      render();
      document.querySelector(`[data-exp-row="${state.expSelectedId}"]`)?.scrollIntoView({ block: 'nearest' });
    } else if (state.screen === 'explorer' && state.expMode === 'visual' && e.key === '/') {
      e.preventDefault();
      document.getElementById('expSearchInput')?.focus();
    }
  });

  render();
})();
</script>
</body>
</html>
