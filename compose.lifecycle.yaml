# Optional: lets control restart this compose deployment's containers (the compose lifecycle
# driver), through the container engine's API socket. Development only: whoever controls that
# socket controls every container on the host. On Kubernetes, control uses the Kubernetes driver.
#
#   THERMITE_ENGINE_SOCKET_HOST=/run/user/1000/podman/podman.sock \
#     podman compose -f compose.yaml -f compose.lifecycle.yaml up -d
#
# (Rootless Podman: the socket belongs to your user, so control runs as the container's root,
# which is your user on the host, and keeps DAC_OVERRIDE to use its state volume, which belongs
# to the image's control user. Its group stays control's, 10001: the bus's server reads the key
# control writes for it through that group.)
services:
  control:
    user: "0:10001"
    cap_add: [DAC_OVERRIDE]
    # SELinux hosts (for example a Podman machine) label the socket for the host only.
    security_opt: ["label=disable"]
    environment:
      THERMITE_LIFECYCLE: compose
      THERMITE_ENGINE_SOCKET: /run/engine.sock
    volumes:
      - ${THERMITE_ENGINE_SOCKET_HOST:-/var/run/docker.sock}:/run/engine.sock
