# Test only (scripts/acceptance/claude.mjs): the harness and the supervisor with a stand-in for
# Claude Code mounted, so the Claude Code harness and an advisor in Claude Code run end to end
# without a subscription or a download.
services:
  harness:
    environment:
      THERMITE_CLAUDE_BIN: /opt/fake-claude/claude
    volumes:
      - ./containers/test-claude:/opt/fake-claude:ro
  supervisor:
    environment:
      THERMITE_CLAUDE_BIN: /opt/fake-claude/claude
    volumes:
      - ./containers/test-claude:/opt/fake-claude:ro
