# Test only (scripts/acceptance/codex.mjs): the harness and the supervisor with a stand-in for the
# Codex CLI mounted, so the Codex harness and an advisor in Codex run end to end without a ChatGPT
# plan. The images are built without the real Codex (CODEX_VERSION empty), so the test downloads
# nothing for it.
services:
  harness:
    build:
      args:
        CODEX_VERSION: ""
    environment:
      THERMITE_CODEX_BIN: /opt/fake-codex/codex
    volumes:
      - ./containers/test-codex:/opt/fake-codex:ro
  supervisor:
    build:
      args:
        CODEX_VERSION: ""
    environment:
      THERMITE_CODEX_BIN: /opt/fake-codex/codex
    volumes:
      - ./containers/test-codex:/opt/fake-codex:ro
