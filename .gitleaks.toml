# The secret scan's settings (gitleaks 8.30.1; CI pins the version). The scan uses gitleaks'
# default rules. Each allowlist below skips one fake, key-shaped value that the tests or scripts
# use: a finding is skipped only when its rule, its file and its exact value all match.
# A new fake value gets its own entry here, never a wider pattern.
title = "Thermite secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "The made-up RunPod key in control's RunPod tests and the fake RunPod API"
condition = "AND"
targetRules = ["generic-api-key"]
paths = [
  '''^(src|tests)/control/runpod(-tests|-rigs)?\.test\.ts$''',
  '''^src/testing/fake-runpod\.ts$''',
  '''^tests/helpers/fake-runpod\.ts$''',
]
regexes = ['''^rpa_test-key-0123456789abcdef$''']

[[allowlists]]
description = "The made-up model route key in an older agents acceptance script"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^scripts/agents-acceptance\.mjs$''']
regexes = ['''^route-key-acceptance-0001$''']

# Control makes deploy keys at run time. The source holds only the armour lines around a key, as
# two constants on adjacent lines, and no key. The pattern matches those two lines and nothing
# between them.
[[allowlists]]
description = "The armour constants of the deploy-key maker, with no key between them"
condition = "AND"
targetRules = ["private-key"]
paths = ['''^src/control/git-keys\.ts$''']
regexes = [
  '''^-----BEGIN OPENSSH PRIVATE KEY-----"; // public-check: allow \(armour only\)\nconst END = "-----END OPENSSH PRIVATE KEY-----$''',
]

# xterm.js 6.0.0, bundled in vendor/xterm/ (goal 169), is minified: two of its class names read as
# key assignments to the generic rule. Each is skipped by its exact text, in that file only.
[[allowlists]]
description = "Two minified class names in the bundled xterm.js 6.0.0"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^vendor/xterm/xterm\.js$''']
regexes = ['''^t\.TwoKeyMap=void$''', '''^t\.Sequencer=t\.Throttler=void$''']

# Made-up values in tests that the generic rule reads as keys: each by its file and exact value.
[[allowlists]]
description = "A made-up GitHub token the scrubber's test masks"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/common/scrub\.test\.ts$''']
regexes = ['''^ghp_AbCdEfGh0123456789$''']

[[allowlists]]
description = "A made-up leaf key (base64 of 'not a key') in the leaf link's test"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/core/link/leaf\.test\.ts$''']
regexes = ['''^bm90IGEga2V5$''']

[[allowlists]]
description = "A kit's file name next to the signing key's name in the backup test"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/system/backup\.test\.ts$''']
regexes = ['''^kits/matmul/HEAD$''']

[[allowlists]]
description = "Three attempt keys (hashes) in a ledger that v0.1.0 wrote, kept as a test's data"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''^tests/helpers/data/ledger-v0\.1\.0\.sql$''']
regexes = [
  '''^412b82e3242b0532be20cad57a56ab3accf5d947787bc9a4d1d1c770633aed6a$''',
  '''^19464f76c542507e3b7ce329a45e50ac97689e204a4daa03360b8e2e2069a0a3$''',
  '''^753bc26ec4df7d2d13bf26a2e61d5bcfaf56c1eda659618fbbea2c136c6d65ad$''',
]
